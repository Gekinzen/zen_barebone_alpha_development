<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- One Dark themed menu icon - hamburger style with accent -->
  <defs>
    <linearGradient id="onedarkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c678dd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#61afef;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#282c34"/>
  
  <!-- Three horizontal lines -->
  <rect x="14" y="18" width="36" height="4" rx="2" fill="url(#onedarkGrad)"/>
  <rect x="14" y="30" width="28" height="4" rx="2" fill="#abb2bf"/>
  <rect x="14" y="42" width="20" height="4" rx="2" fill="#5c6370"/>
</svg>
