##Import Files

source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/modules/autostart.conf
source = ~/.config/hypr/modules/look_and_feel.conf
source = ~/.config/hypr/modules/animations.conf


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun


source = ~/.config/hypr/modules/binds.conf

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow





# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}



##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

exec-once = ~/.config/hypr/scripts/wallpaper-slideshow.sh




# Floating terminals
windowrulev2 = float,class:^(kitty)$
windowrulev2 = center,class:^(kitty)$

# Dialogs
windowrulev2 = float,title:^(Open File|Save File|Preferences)$
windowrulev2 = center,title:^(Open File|Save File|Preferences)$

# Picture-in-picture
windowrulev2 = float,title:^(Picture-in-Picture)$
windowrulev2 = pin,title:^(Picture-in-Picture)$

# Hypr Control Center
windowrulev2 = float,class:^(com\.hyprland\.controlcenter)$
windowrulev2 = center,class:^(com\.hyprland\.controlcenter)$
#windowrulev2 = size 900 600,class:^(com\.hyprland\.controlcenter)$


#flameshot
windowrulev2 = float,class:^(flameshot)$
windowrulev2 = center,class:^(flameshot)$



# Floating terminals
windowrulev2 = float,class:^(thunar)$
windowrulev2 = center,class:^(thunar))$





# Match by namespace
layerrule = blur, waybar

# If you want to be more specific
layerrule = blur, namespace:waybar

# Or by surface (if namespace doesn't work)
layerrule = blur, ^(waybar)$




####################### PLUGINS  ###########################
# At the top or in your exec-once section
exec-once = hyprpm reload -n

# Hyprbars - Window title bars
plugin {
    hyprbars {
        # Bar height
        bar_height = 28
        
        # Bar color
        col.text = rgb(ffffff)
        bar_color = rgb(1e1e2e)
        
        # Button colors
        col.button_close = rgb(f38ba8)
        col.button_minimize = rgb(f9e2af)
        col.button_maximize = rgb(a6e3a1)
        
        # Bar text (window title)
        bar_text_size = 11
        bar_text_font = JetBrainsMono Nerd Font
        bar_text_align = center
        
        # Bar padding
        bar_padding = 8
        
        # Buttons
        bar_button_padding = 8
        bar_buttons_alignment = left

        # macOS-style buttons
        # Hyprbars window decoration buttons
        hyprbars-button = rgb(ff5f56), 17, , hyprctl dispatch killactive
        hyprbars-button = rgb(ffbd2e), 17, , ~/.config/hypr/scripts/waybar/hyprbars-minimize.sh
        hyprbars-button = rgb(27c93f), 17, , hyprctl dispatch fullscreen 1
        
        on_double_click = hyprctl dispatch fullscreen 1

    }
        hyprspace {
        # Workspace spacing sa overview
        overview_gapsout = 20
        overview_gapsin = 10
        
        # Number of columns sa overview
        overview_columns = 3
        
        # Auto-close overview after selecting workspace
        overview_autohide = true
        
        # Show workspace names
        overview_show_names = true
    }
}


# ==========================================
# PLUGIN KEYBINDS
# ==========================================

# Hyprspace overview toggle
#bind = $mainMod, grave, overview:toggle  # Super + ` (backtick)
#bind = $mainMod, Tab, overview:toggle    # Super + Tab (alternative)

# Window rules for hyprbars
windowrulev2 = plugin:hyprbars:nobar, floating:0
windowrulev2 = plugin:hyprbars:nobar, fullscreen:1
windowrulev2 = plugin:hyprbars:title_color rgb(ffffff), class:.*


# Disable hyprbars on Start Menu
windowrulev2 = plugin:hyprbars:nobar, title:^(Start Menu)$
windowrulev2 = plugin:hyprbars:nobar, title:^(hypr-widget-clock)$
windowrulev2 = plugin:hyprbars:nobar, title:^(hypr-widget-weather)$
windowrulev2 = plugin:hyprbars:nobar, title:^(hypr-widget-system_monitor)$





# ~/.config/hypr/hyprland.conf

# ═══════════════════════════════════════════════════════════════
# Desktop Widgets - Fully Automatic
# ═══════════════════════════════════════════════════════════════

# ~/.config/hypr/hyprland.conf

# ═══════════════════════════════════════════════════════════════
# Desktop Widgets
# ═══════════════════════════════════════════════════════════════

# ~/.config/hypr/hyprland.conf

# ═══════════════════════════════════════════════════════════════
# Desktop Widgets
# ═══════════════════════════════════════════════════════════════

#exec-once = ~/.config/hypr/scripts/start-widgets.sh


# All widgets basic rules
windowrulev2 = float, title:^(hypr-widget-)
windowrulev2 = noborder, title:^(hypr-widget-)
windowrulev2 = noshadow, title:^(hypr-widget-)
windowrulev2 = noanim, title:^(hypr-widget-)
windowrulev2 = pin, title:^(hypr-widget-)
windowrulev2 = nofocus, title:^(hypr-widget-)
windowrulev2 = noinitialfocus, title:^(hypr-widget-)

# Clock - NO opacity rule, let GTK handle transparency
# NO noblur on clock!

# Weather & System Monitor
windowrulev2 = noblur, title:^(hypr-widget-weather)
windowrulev2 = noblur, title:^(hypr-widget-system_monitor)
windowrulev2 = opaque, title:^(hypr-widget-weather)
windowrulev2 = opaque, title:^(hypr-widget-system_monitor)

# Sizes
windowrulev2 = size 500 200, title:^(hypr-widget-clock)
windowrulev2 = size 620 480, title:^(hypr-widget-weather)
windowrulev2 = size 580 420, title:^(hypr-widget-system_monitor)

# Positions
windowrulev2 = move 100 100, title:^(hypr-widget-clock)
windowrulev2 = move 100 350, title:^(hypr-widget-weather)
windowrulev2 = move 750 350, title:^(hypr-widget-system_monitor)