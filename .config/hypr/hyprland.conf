# ─────────────────────────────────────────────────────────────
# HYPRLAND 0.53+ COMPATIBLE CONFIG
# ─────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────
# IMPORT FILES
# ─────────────────────────────────────────────────────────────
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/modules/autostart.conf
source = ~/.config/hypr/modules/look_and_feel.conf
source = ~/.config/hypr/modules/animations.conf
source = ~/.config/hypr/modules/binds.conf

# ─────────────────────────────────────────────────────────────
# PROGRAMS
# ─────────────────────────────────────────────────────────────
$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun

# ─────────────────────────────────────────────────────────────
# ENVIRONMENT
# ─────────────────────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# ─────────────────────────────────────────────────────────────
# INPUT
# ─────────────────────────────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

# ─────────────────────────────────────────────────────────────
# GESTURES (0.51+ NEW SYNTAX)
# Old workspace_swipe options are REMOVED
# Use: gesture = <fingers>, <direction>, <action>
# ─────────────────────────────────────────────────────────────
gesture = 3, horizontal, workspace

# ─────────────────────────────────────────────────────────────
# LAYOUTS
# ─────────────────────────────────────────────────────────────
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
    # 0.53: on_focus_under_fullscreen replaces new_window_takes_over_fullscreen
    # on_focus_under_fullscreen = 0
}

# ─────────────────────────────────────────────────────────────
# WINDOW RULES (0.53 NEW SYNTAX)
# 
# NEW FORMAT: windowrule = <effect> <value>, match:<matcher> <pattern>
# OR BLOCK:
#   windowrule {
#       name = rule-name
#       match:class = pattern
#       float = true
#   }
#
# IMPORTANT CHANGES:
# - suppressevent -> suppress_event
# - nofocus -> no_focus  
# - noborder -> border_size 0  (noborder is NOT valid)
# - noshadow -> no_shadow
# - noanim -> no_anim
# - All effects need values (e.g., "float true" not just "float")
# ─────────────────────────────────────────────────────────────

# Suppress maximize events for all windows
windowrule = suppress_event maximize, match:class .*

# Focus fix for XWayland (commented - may need adjustment per setup)
# windowrule = no_focus on, match:class ^$ match:title ^$ match:xwayland true match:floating true match:fullscreen 0 match:pinned false

# Terminals - float and center
windowrule {
    name = terminal-rules
    match:class = ^(kitty)$
    float = true
    center = true
}

# File manager - float and center
windowrule {
    name = filemanager-rules
    match:class = ^(thunar)$
    float = true
    center = true
}

# Flameshot - float and center
windowrule {
    name = flameshot-rules
    match:class = ^(flameshot)$
    float = true
    center = true
}

# Picture in Picture
windowrule {
    name = pip-rules
    match:title = ^(Picture-in-Picture)$
    float = true
    pin = true
}

# Steam notifications
windowrule {
    name = steam-notif-rules
    match:class = ^(steam)$
    match:title = ^(notificationtoasts)$
    float = true
    pin = true
    move = 100%-450 40
}

# ─────────────────────────────────────────────────────────────
# LAYER RULES (0.53 NEW SYNTAX)
# Format: layerrule = <effect> <value>, match:namespace <pattern>
# - blur is boolean: blur on/off (not just "blur")
# - ignorezero is now ignore_alpha 1
# - ignorealpha 0.5 is now ignore_alpha 0.5
# ─────────────────────────────────────────────────────────────

layerrule = blur on, ignore_alpha 0.5, match:namespace waybar
layerrule = blur on, ignore_alpha 1, match:namespace notifications
layerrule = blur on, ignore_alpha 0.5, match:namespace start-menu
layerrule = blur on, ignore_alpha 0.5, match:namespace hypr-control-center

# ─────────────────────────────────────────────────────────────
# AUTOSTART
# ─────────────────────────────────────────────────────────────
exec-once = ~/.config/hypr/scripts/swww-init.sh
exec-once = hyprpm reload -n
exec-once = ~/.config/hypr-control-center/src/zenpybar/run.sh

# ─────────────────────────────────────────────────────────────
# PLUGINS
# ─────────────────────────────────────────────────────────────
plugin:hyprbars {
    bar_height = 28
    bar_color = rgb(1a1b26)
    col.text = rgb(c0caf5)

    col.button_close = rgb(f38ba8)
    col.button_minimize = rgb(f9e2af)
    col.button_maximize = rgb(a6e3a1)

    bar_text_size = 10
    bar_text_font = Adwaita Sans
    bar_text_align = center

    bar_padding = 8
    bar_button_padding = 10
    bar_buttons_alignment = left

    hyprbars-button = rgb(f38ba8), 17, , hyprctl dispatch killactive
    hyprbars-button = rgb(f9e2af), 17, , ~/.config/hypr/scripts/waybar/hyprbars-minimize.sh
    hyprbars-button = rgb(a6e3a1), 17, , hyprctl dispatch fullscreen 1
}

plugin:hyprspace {
    overview_gapsout = 20
    overview_gapsin = 10
    overview_columns = 3
    overview_autohide = true
    overview_show_names = true
}

# ─────────────────────────────────────────────────────────────
# HYPRBARS / BORDER RULES (0.53 SYNTAX)
# noborder is NOT valid - use border_size 0
# ─────────────────────────────────────────────────────────────
windowrule = border_size 0, match:fullscreen 1
windowrule = border_size 0, match:floating true
windowrule = border_size 0, match:title ^(Start Menu)$
windowrule = border_size 0, match:title ^(hypr-widget-)

# ─────────────────────────────────────────────────────────────
# WIDGETS (0.53 SYNTAX)
# ─────────────────────────────────────────────────────────────
windowrule {
    name = widget-rules
    match:title = ^(hypr-widget-)
    float = true
    pin = true
    border_size = 0
    no_shadow = true
    no_anim = true
}

# ─────────────────────────────────────────────────────────────
# FINAL SAFETY
# ─────────────────────────────────────────────────────────────
windowrule = opacity 1.0 override, match:class ^(zenpy|hypr-control-center)$