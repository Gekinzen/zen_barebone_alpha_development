# ─────────────────────────────────────────────────────────────
# IMPORT FILES
# ─────────────────────────────────────────────────────────────
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/modules/autostart.conf
source = ~/.config/hypr/modules/look_and_feel.conf
source = ~/.config/hypr/modules/animations.conf
source = ~/.config/hypr/modules/binds.conf

# ─────────────────────────────────────────────────────────────
# PROGRAMS
# ─────────────────────────────────────────────────────────────
$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun

# ─────────────────────────────────────────────────────────────
# ENVIRONMENT
# ─────────────────────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# ─────────────────────────────────────────────────────────────
# INPUT
# ─────────────────────────────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace

# ─────────────────────────────────────────────────────────────
# LAYOUTS
# ─────────────────────────────────────────────────────────────
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}

# ─────────────────────────────────────────────────────────────
# WINDOW RULES (FIXED)
# ─────────────────────────────────────────────────────────────
windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = nofocus, class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Terminals
windowrulev2 = float, class:^(kitty)$
windowrulev2 = center, class:^(kitty)$

# File manager
windowrulev2 = float, class:^(thunar)$
windowrulev2 = center, class:^(thunar)$

# Flameshot
windowrulev2 = float, class:^(flameshot)$
windowrulev2 = center, class:^(flameshot)$

# Picture in Picture
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$

# Steam notifications
windowrulev2 = float, class:^(steam)$, title:^(notificationtoasts)$
windowrulev2 = pin, class:^(steam)$, title:^(notificationtoasts)$
windowrulev2 = move 100%-450 40, class:^(steam)$, title:^(notificationtoasts)$

# ─────────────────────────────────────────────────────────────
# LAYER RULES (VALID)
# ─────────────────────────────────────────────────────────────
layerrule = blur, waybar
layerrule = ignorealpha 0.5, waybar

layerrule = blur, notifications
layerrule = ignorezero, notifications

layerrule = blur, start-menu
layerrule = ignorealpha 0.5, start-menu

layerrule = blur, hypr-control-center
layerrule = ignorealpha 0.5, hypr-control-center

# ─────────────────────────────────────────────────────────────
# AUTOSTART
# ─────────────────────────────────────────────────────────────
exec-once = ~/.config/hypr/scripts/wallpaper-slideshow.sh
exec-once = hyprpm reload -n
exec-once = ~/.config/hypr-control-center/src/zenpybar/run.sh

# ─────────────────────────────────────────────────────────────
# PLUGINS (CORRECT STRUCTURE)
# ─────────────────────────────────────────────────────────────
plugin {
    hyprbars {
        bar_height = 28
        bar_color = rgb(1a1b26)
        col.text = rgb(c0caf5)

        col.button_close = rgb(f38ba8)
        col.button_minimize = rgb(f9e2af)
        col.button_maximize = rgb(a6e3a1)

        bar_text_size = 10
        bar_text_font = Adwaita Sans
        bar_text_align = center

        bar_padding = 8
        bar_button_padding = 10
        bar_buttons_alignment = left

        hyprbars-button = rgb(f38ba8), 17, , hyprctl dispatch killactive
        hyprbars-button = rgb(f9e2af), 17, , ~/.config/hypr/scripts/waybar/hyprbars-minimize.sh
        hyprbars-button = rgb(a6e3a1), 17, , hyprctl dispatch fullscreen 1

        on_double_click = hyprctl dispatch fullscreen 1
    }
}

plugin {
    hyprspace {
        overview_gapsout = 20
        overview_gapsin = 10
        overview_columns = 3
        overview_autohide = true
        overview_show_names = true
    }
}

# ─────────────────────────────────────────────────────────────
# HYPRBARS RULES
# ─────────────────────────────────────────────────────────────
windowrulev2 = plugin:hyprbars:nobar, fullscreen
windowrulev2 = plugin:hyprbars:nobar, floating
windowrulev2 = plugin:hyprbars:nobar, title:^(Start Menu)$
windowrulev2 = plugin:hyprbars:nobar, title:^(hypr-widget-)

# ─────────────────────────────────────────────────────────────
# WIDGETS
# ─────────────────────────────────────────────────────────────
windowrulev2 = float, title:^(hypr-widget-)
windowrulev2 = pin, title:^(hypr-widget-)
windowrulev2 = noborder, title:^(hypr-widget-)
windowrulev2 = noshadow, title:^(hypr-widget-)
windowrulev2 = noanim, title:^(hypr-widget-)

# ─────────────────────────────────────────────────────────────
# FINAL SAFETY
# ─────────────────────────────────────────────────────────────
windowrulev2 = opacity 1.0 override, class:^(zenpy|hypr-control-center)$
