# ═══════════════════════════════════════════════════════════════
# HYPRLAND 0.53+ CONFIGURATION
# ═══════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────
# IMPORTS
# ─────────────────────────────────────────────────────────────
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/modules/autostart.conf
source = ~/.config/hypr/modules/look_and_feel.conf
source = ~/.config/hypr/modules/animations.conf
source = ~/.config/hypr/modules/binds.conf

# ─────────────────────────────────────────────────────────────
# PROGRAMS
# ─────────────────────────────────────────────────────────────
$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun

# ─────────────────────────────────────────────────────────────
# ENVIRONMENT
# ─────────────────────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# ─────────────────────────────────────────────────────────────
# INPUT
# ─────────────────────────────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
    }
}

# ─────────────────────────────────────────────────────────────
# GESTURES (0.51+ SYNTAX)
# ─────────────────────────────────────────────────────────────
gesture = 3, horizontal, workspace

# ─────────────────────────────────────────────────────────────
# LAYOUTS
# ─────────────────────────────────────────────────────────────
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}

# ─────────────────────────────────────────────────────────────
# WINDOW RULES (0.53 SYNTAX - ONE LINE FORMAT)
# ─────────────────────────────────────────────────────────────

# Suppress maximize
windowrule = suppress_event maximize, match:class .*

# Terminals
windowrule = float true, match:class ^(kitty)$
windowrule = center true, match:class ^(kitty)$

# File manager
windowrule = float true, match:class ^(thunar)$
windowrule = center true, match:class ^(thunar)$

# Flameshot
windowrule = float true, match:class ^(flameshot)$
windowrule = center true, match:class ^(flameshot)$

# Picture in Picture
windowrule = float true, match:title ^(Picture-in-Picture)$
windowrule = pin true, match:title ^(Picture-in-Picture)$

# Steam notifications
windowrule = float true, match:class ^(steam)$ match:title ^(notificationtoasts)$
windowrule = pin true, match:class ^(steam)$ match:title ^(notificationtoasts)$
windowrule = move 100%-450 40, match:class ^(steam)$ match:title ^(notificationtoasts)$

# ─────────────────────────────────────────────────────────────
# LAYER RULES (0.53 SYNTAX)
# ─────────────────────────────────────────────────────────────

layerrule = blur on, ignore_alpha 0.5, match:namespace waybar
layerrule = blur on, ignore_alpha 1, match:namespace notifications
layerrule = blur on, ignore_alpha 0.5, match:namespace start-menu
layerrule = blur on, ignore_alpha 0.5, match:namespace hypr-control-center

# ─────────────────────────────────────────────────────────────
# AUTOSTART
# ─────────────────────────────────────────────────────────────
exec-once = ~/.config/hypr/scripts/swww-init.sh
exec-once = hyprpm reload -n
exec-once = ~/.config/hypr-control-center/src/zenpybar/run.sh

# ─────────────────────────────────────────────────────────────
# PLUGINS
# ─────────────────────────────────────────────────────────────
plugin:hyprbars {
    bar_height = 28
    bar_color = rgb(1a1b26)
    col.text = rgb(c0caf5)
    col.button_close = rgb(f38ba8)
    col.button_minimize = rgb(f9e2af)
    col.button_maximize = rgb(a6e3a1)
    bar_text_size = 10
    bar_text_font = Adwaita Sans
    bar_text_align = center
    bar_padding = 8
    bar_button_padding = 10
    bar_buttons_alignment = left
    hyprbars-button = rgb(f38ba8), 17, , hyprctl dispatch killactive
    hyprbars-button = rgb(f9e2af), 17, , ~/.config/hypr/scripts/waybar/hyprbars-minimize.sh
    hyprbars-button = rgb(a6e3a1), 17, , hyprctl dispatch fullscreen 1
}

plugin:hyprspace {
    overview_gapsout = 20
    overview_gapsin = 10
    overview_columns = 3
    overview_autohide = true
    overview_show_names = true
}

# ─────────────────────────────────────────────────────────────
# BORDER RULES (use "float" NOT "floating"!)
# ─────────────────────────────────────────────────────────────
windowrule = border_size 0, match:fullscreen 1
windowrule = border_size 0, match:float true
windowrule = border_size 0, match:title ^(Start Menu)$
windowrule = border_size 0, match:title ^(hypr-widget-)

# ─────────────────────────────────────────────────────────────
# WIDGETS
# ─────────────────────────────────────────────────────────────
windowrule = float true, match:title ^(hypr-widget-)
windowrule = pin true, match:title ^(hypr-widget-)
windowrule = border_size 0, match:title ^(hypr-widget-)
windowrule = no_shadow true, match:title ^(hypr-widget-)
windowrule = no_anim true, match:title ^(hypr-widget-)

# ─────────────────────────────────────────────────────────────
# OPACITY
# ─────────────────────────────────────────────────────────────
windowrule = opacity 1.0 override, match:class ^(zenpy|hypr-control-center)$