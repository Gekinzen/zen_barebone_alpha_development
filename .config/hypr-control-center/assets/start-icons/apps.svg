<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Simple 9-dot grid icon -->
  <defs>
    <linearGradient id="dotsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#98c379;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7cb668;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="32" cy="32" r="30" fill="#1e222a" opacity="0.9"/>
  
  <!-- 9 dots in 3x3 grid -->
  <circle cx="18" cy="18" r="5" fill="url(#dotsGrad)"/>
  <circle cx="32" cy="18" r="5" fill="url(#dotsGrad)"/>
  <circle cx="46" cy="18" r="5" fill="url(#dotsGrad)"/>
  
  <circle cx="18" cy="32" r="5" fill="url(#dotsGrad)"/>
  <circle cx="32" cy="32" r="5" fill="url(#dotsGrad)"/>
  <circle cx="46" cy="32" r="5" fill="url(#dotsGrad)"/>
  
  <circle cx="18" cy="46" r="5" fill="url(#dotsGrad)"/>
  <circle cx="32" cy="46" r="5" fill="url(#dotsGrad)"/>
  <circle cx="46" cy="46" r="5" fill="url(#dotsGrad)"/>
</svg>
