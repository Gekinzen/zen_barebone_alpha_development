<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Windows 11 style 4-square grid -->
  <defs>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#61afef;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#528bff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="32" cy="32" r="30" fill="#1e222a" opacity="0.9"/>
  
  <!-- 4 squares with gap -->
  <rect x="14" y="14" width="16" height="16" rx="3" fill="url(#gridGrad)"/>
  <rect x="34" y="14" width="16" height="16" rx="3" fill="url(#gridGrad)"/>
  <rect x="14" y="34" width="16" height="16" rx="3" fill="url(#gridGrad)"/>
  <rect x="34" y="34" width="16" height="16" rx="3" fill="url(#gridGrad)"/>
</svg>
