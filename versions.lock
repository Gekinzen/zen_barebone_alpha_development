# ═══════════════════════════════════════════════════════════════
# Zen Shell version lock
# ═══════════════════════════════════════════════════════════════
# Auto-generated by scripts/zen-make-versions-lock.sh on the
# maintainer's dev machine before each release tarball is cut.
#
# Format:
#   <pkg>=<major.minor>           ← enforced (patch .X floats freely)
#   <pkg>__full=<full-version>    ← informational ("tested against")
#
# Override at install time:
#   ZEN_FORCE_VERSIONS=1 ./install.sh
#
# Patch upgrades (e.g. 0.54.3 → 0.54.4) are SILENTLY OK.
# Major/minor mismatches WARN (newer) or BLOCK (older).
# ═══════════════════════════════════════════════════════════════

# ── Compositor ──
hyprland=0.54
hyprland__full=0.54.3

# ── QML runtime host (the binary that actually loads zen-shell) ──
quickshell=0.2
quickshell__full=0.2.0

# ── Qt6 stack that Quickshell links against ──
qt6_declarative=6.9
qt6_declarative__full=6.9.3

qt6_wayland=6.9
qt6_wayland__full=6.9.3

qt6_5compat=6.9
qt6_5compat__full=6.9.3

qt6_svg=6.9
qt6_svg__full=6.9.3

# ── Optional baseline notes (not enforced, just recorded) ──
# kernel__full=6.19.12-1-cachyos
# distro__full=CachyOS rolling
