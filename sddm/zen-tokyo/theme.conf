[General]
# ════════════════════════════════════════════════════════════════
# Zen Tokyo SDDM theme — configuration
# ════════════════════════════════════════════════════════════════
# Every value here is rewritten by zen-sddm-sync.sh at logout /
# wallpaper-change so the greeter tracks your live desktop:
#   - background      → copy of your current Zen wallpaper
#   - clockFont/font  → mapped from your bar's fontFamilyId (same
#                       mapping zen-lock.sh uses for hyprlock)
#   - colours         → Tokyo-Night defaults now; a future release
#                       regenerates them from the active scheme
#                       (mirrors the note in hyprlock.conf).
# The values below are just the Tokyo-Night seed; the sync hook
# overwrites them with whatever theme the user has selected.
# ════════════════════════════════════════════════════════════════

# ── Background — static copy of the live wallpaper ──
# SDDM's greeter runs as the `sddm` user BEFORE login, so it cannot
# read your $HOME wallpaper. zen-sddm-sync.sh copies the current
# wallpaper into this world-readable theme dir; the QML blurs +
# darkens it at display time (same approach as hyprlock's live blur).
background=backgrounds/current

# backgroundMode: wallpaper (blurred image) | matugen (solid scheme colour)
# Set by zen-sddm-sync.sh from Settings → Login Screen.
backgroundMode=wallpaper

# Blur + darken (applied in QML, mirrors hyprlock blur_passes/brightness)
blurRadius=64
dimOpacity=0.45
vignette=true

# ── Fonts (match the lock screen / desktop clock) ──
clockFont=Adwaita Sans Black
textFont=Adwaita Sans

# ── Clock ──
showClock=true
clockFormat=HH:mm
clockPixelSize=152

# ── Greeting + optional mood/care lines ──
# Greeting is computed live in QML (no file needed). moodLine/careLine
# are optional; zen-sddm-sync.sh can export them from
# zen-lock-message.sh into the files below (empty → hidden).
showGreeting=true
moodCareFile=mood-care.txt

# ── Tokyo-Night palette (== hyprlock.conf colours) ──
colorBackground=#16161e
colorSurface=#24283b
colorText=#dce2f8
colorTextDim=#94a3c2
colorAccent=#7aa2f7
colorAccentText=#16161e
colorSuccess=#9ece6a
colorError=#f7768e
colorBorder=#3b4261

# ── Behaviour ──
showUserSelector=true
showSessionSelector=true
showPowerControls=true
showKeyboardLayout=true
showCursor=true
