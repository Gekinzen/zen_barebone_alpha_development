<?xml version="1.0" encoding="UTF-8"?>
<!--
  CachyOS logo — simplified for Zen Shell Start Button.
  Stylized rendition using CachyOS brand-adjacent green gradient.
  Original mark © CachyOS project, used for platform identification.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="cachyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#5BE584"/>
      <stop offset="100%" stop-color="#0E9448"/>
    </linearGradient>
  </defs>
  <!-- Rounded hexagonal shield -->
  <path d="M64 10
           L110 36
           L110 92
           L64 118
           L18 92
           L18 36 Z"
        fill="url(#cachyGrad)"/>
  <!-- Inner accent ring -->
  <path d="M64 22
           L98 42
           L98 86
           L64 106
           L30 86
           L30 42 Z"
        fill="none" stroke="#ffffff" stroke-width="2" opacity="0.55"/>
  <!-- Stylized "C" -->
  <path d="M82 48
           A24 24 0 1 0 82 80"
        fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
</svg>
