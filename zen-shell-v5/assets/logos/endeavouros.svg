<?xml version="1.0" encoding="UTF-8"?>
<!--
  EndeavourOS logo — simplified.
  Brand uses magenta → purple → blue gradient.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="endeavGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#EF2E7A"/>
      <stop offset="55%"  stop-color="#7E3AA7"/>
      <stop offset="100%" stop-color="#2577E3"/>
    </linearGradient>
  </defs>
  <polygon points="64,14 118,114 10,114" fill="url(#endeavGrad)"/>
  <polygon points="64,44 96,104 32,104" fill="#0a0a14" opacity="0.18"/>
</svg>
