# ═══════════════════════════════════════════════════════════════
# LOOK AND FEEL
# Path: ~/.config/hypr/modules/look_and_feel.conf
# ═══════════════════════════════════════════════════════════════

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(414868aa)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 12
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = false
    }
    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(1a1a2e88)
    }
}

animations {
    enabled = true
    bezier = zenSmooth, 0.05, 0.9, 0.1, 1.05
    bezier = zenSnap, 0.16, 1, 0.3, 1
    animation = windows, 1, 5, zenSmooth
    animation = windowsOut, 1, 5, zenSnap, popin 80%
    animation = fade, 1, 4, zenSmooth
    animation = workspaces, 1, 4, zenSnap, slide
    animation = border, 1, 8, zenSmooth
    animation = borderangle, 1, 30, zenSmooth, loop
}
