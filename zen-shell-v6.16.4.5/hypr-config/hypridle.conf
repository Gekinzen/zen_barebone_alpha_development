# ════════════════════════════════════════════════════════════════
# hypridle.conf v6.16.3.8 — User-configurable idle cascade
# Path: ~/.config/hypr/hypridle.conf
# ────────────────────────────────────────────────────────────────
# Wired by: hypr-config/autostart.conf → exec-once = hypridle
#
# v6.16.3.8 key change: timeouts are now user-configurable via
# Settings → Power → Idle Behavior. The values on the timeout
# lines below are DEFAULTS — zen-hypridle-sync.sh reads the user's
# choices from panel-state.json and updates the timeouts in-place
# via sed on every setting change, then restarts hypridle.
#
# Markers:
#   # ZEN_IDLE_LOCK   — lock-screen timeout (user picks 30s-5h-never)
#   # ZEN_IDLE_DPMS   — DPMS off (auto-derived: ZEN_IDLE_LOCK + 60s)
#   # ZEN_IDLE_SLEEP  — systemctl suspend (user picks 30s-5h-never)
#
# "Never" sentinel: timeout = 99999999 (~3 years). Keeps the
# listener declared (hypridle validates the block) but it'll never
# fire unless the user literally idles for years.
#
# User can hand-edit any line that doesn't have a ZEN_IDLE_* marker —
# sync script only touches marked lines. Preserves `before_sleep_cmd`,
# `after_sleep_cmd`, and any custom listener blocks the user adds.
# ════════════════════════════════════════════════════════════════

general {
    # v6.16.3.2.1: route through zen-lock.sh for live wallpaper sync.
    # The `pidof hyprlock || ...` guard prevents stacking lock screens
    # if hypridle re-fires before user unlocks.
    lock_cmd       = pidof hyprlock || ~/.local/bin/zen-lock.sh

    # Run BEFORE the system goes to sleep. Ensures hyprlock is up
    # before suspend so on wake the user lands on the lock screen.
    # Uses loginctl lock-session which respects our lock_cmd above.
    before_sleep_cmd = loginctl lock-session

    # Run when the screen wakes up. zen-resume-handler.sh does the
    # full DRM kick / swww restart / hyprlock zombie-kick pipeline.
    # Plain dpms on as a fast first step; resume handler finishes it.
    after_sleep_cmd = hyprctl dispatch dpms on
}

# ─────────────────────────────────────────────────────────────
# Lock screen on idle — ZEN_IDLE_LOCK
# Default 5 minutes. User can pick 30s, 1m, 30m, 1h, 3h, 5h, never.
# ─────────────────────────────────────────────────────────────
listener {
    timeout      = 300    # ZEN_IDLE_LOCK
    on-timeout   = loginctl lock-session
}

# ─────────────────────────────────────────────────────────────
# DPMS off — ZEN_IDLE_DPMS
# Auto-derived: 60s AFTER the lock fires. Gives the user a brief
# window to enter password without waking the display again. When
# ZEN_IDLE_LOCK = never, this is also set to never.
# ─────────────────────────────────────────────────────────────
listener {
    timeout      = 360    # ZEN_IDLE_DPMS
    on-timeout   = hyprctl dispatch dpms off
    on-resume    = hyprctl dispatch dpms on
}

# ─────────────────────────────────────────────────────────────
# Suspend — ZEN_IDLE_SLEEP
# Default never (99999999) to preserve v6.16.3.7 behavior where
# desktops didn't auto-suspend. Users enable via Settings → Power
# → Sleep after.
# ─────────────────────────────────────────────────────────────
listener {
    timeout      = 99999999    # ZEN_IDLE_SLEEP
    on-timeout   = systemctl suspend
    on-resume    = hyprctl dispatch dpms on
}
