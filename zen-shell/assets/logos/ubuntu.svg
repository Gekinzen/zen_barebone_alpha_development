<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ubuntu "Circle of Friends" — simplified.
  Brand color: Ubuntu orange #E95420.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <circle cx="64" cy="64" r="52" fill="#E95420"/>
  <!-- Three outer dots at 0°, 120°, 240° -->
  <circle cx="108" cy="64" r="10" fill="#ffffff"/>
  <circle cx="42"  cy="26" r="10" fill="#ffffff"/>
  <circle cx="42"  cy="102" r="10" fill="#ffffff"/>
  <!-- Inner ring -->
  <circle cx="64" cy="64" r="22" fill="none" stroke="#ffffff" stroke-width="4"/>
</svg>
