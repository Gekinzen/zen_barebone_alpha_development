# ~/.config/hypr/zen-shell-dashboard.conf
# ─────────────────────────────────────────────────────────────
# Zen Control Center — merged Quick Settings + Hyprland Control Center
# (v7.0.0-beta.1-hf99zp)
#
# ENABLE (once):
#   1. copy THIS FILE to ~/.config/hypr/ first (the source= line below fails
#      with "globbing error: found no match" if the file isn't there yet)
#   2. add to ~/.config/hypr/hyprland.conf:
#        source = ~/.config/hypr/zen-shell-dashboard.conf
#   3. hyprctl reload
#
#   The installer does all three for you.
#
# Both SUPER+C and SUPER+, open the SAME dashboard — that's the merge:
# one window with Quick Settings on the right rail and the Control Center
# pages (Appearance / Shell Look / Widgets / Panel) in the main area.
#
# Prefer the old separate windows? Just don't source this file; the classic
# Quick Settings panel and Settings window are untouched and still bound to
# whatever you had.
# ─────────────────────────────────────────────────────────────

bind = SUPER, C,     exec, qs -c zen-shell ipc call zen toggleDashboard
bind = SUPER, comma, exec, qs -c zen-shell ipc call zen toggleDashboard

# Optional: keep dedicated keys for the classic windows (both still exist)
# bind = SUPER SHIFT, C,     exec, qs -c zen-shell ipc call zen toggleControlCenter
# bind = SUPER SHIFT, comma, exec, qs -c zen-shell ipc call zen toggleSettings
