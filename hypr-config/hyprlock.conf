# ════════════════════════════════════════════════════════════════
# hyprlock.conf v6.16.3.2 — Minimal styled lock screen
# Path: ~/.config/hypr/hyprlock.conf
# ────────────────────────────────────────────────────────────────
# Wired by:
#   - hypridle.conf → lock_cmd = pidof hyprlock || hyprlock
#   - zen-lid-handler.sh → lock_screen() (smart mode)
#   - StartMenuPanel.qml → "Lock" power button → hyprlock
#
# Color palette mirrors Tokyo-Night (the v6.16.3.2 default scheme).
# Users on other themes can hand-tweak the rgba(...) values below
# OR drop their own ~/.config/hypr/hyprlock.conf to override.
# A future v6.16.3.X may auto-generate this from the active scheme
# JSON, mirroring what regen-swaync-theme.sh does for swaync.
# ────────────────────────────────────────────────────────────────
# Changes vs nothing (this file is NEW in v6.16.3.2):
#   + First proper Zen Shell lock screen
#   + Wallpaper background with subtle blur (cheap GPU-side)
#   + Tokyo-Night palette accents
#   + Time / date / user widgets
# ════════════════════════════════════════════════════════════════

general {
    grace                  = 0          # require password immediately
    hide_cursor            = true
    no_fade_in             = false
    disable_loading_bar    = true
}

# ── Background ──
# Use the current wallpaper if swww has cached one; else fall back
# to a flat Tokyo-Night background color.
background {
    monitor    =
    path       = screenshot                   # auto: takes a screenshot of
                                              # the desktop just before lock
    blur_passes  = 3
    blur_size    = 6
    noise        = 0.0117
    contrast     = 0.9
    brightness   = 0.7
    vibrancy     = 0.169
    vibrancy_darkness = 0.0
}

# ── Time (top-center) ──
label {
    monitor   =
    text      = cmd[update:1000] echo "$(date '+%H:%M')"
    font_size = 96
    font_family = Adwaita Sans
    color     = rgba(192, 202, 245, 1.0)      # Theme.fg = #c0caf5
    position  = 0, 200
    halign    = center
    valign    = center
}

# ── Date (under time) ──
label {
    monitor   =
    text      = cmd[update:18000000] echo "$(date '+%A, %B %d')"
    font_size = 22
    font_family = Adwaita Sans
    color     = rgba(86, 95, 137, 1.0)        # Theme.fgDim = #565f89
    position  = 0, 100
    halign    = center
    valign    = center
}

# ── User avatar (placeholder; uses default if no avatar set) ──
image {
    monitor   =
    path      = $HOME/.config/quickshell/zen-shell/avatar.png
    size      = 110
    rounding  = -1                            # -1 = circular
    border_size  = 3
    border_color = rgba(122, 162, 247, 1.0)   # Theme.blue = #7aa2f7
    position  = 0, -50
    halign    = center
    valign    = center
}

# ── Username under avatar ──
label {
    monitor   =
    text      = $USER
    font_size = 16
    font_family = Adwaita Sans
    color     = rgba(192, 202, 245, 1.0)      # Theme.fg
    position  = 0, -180
    halign    = center
    valign    = center
}

# ── Password input ──
input-field {
    monitor             =
    size                = 320, 56
    outline_thickness   = 2
    dots_size           = 0.28
    dots_spacing        = 0.32
    dots_center         = true

    outer_color         = rgba(122, 162, 247, 1.0)   # Theme.blue
    inner_color         = rgba(36, 40, 59, 0.7)      # Theme.bg1 @ 70%
    font_color          = rgba(192, 202, 245, 1.0)   # Theme.fg

    fade_on_empty       = false
    placeholder_text    = <i><span foreground="##565f89">Password…</span></i>
    hide_input          = false
    rounding            = 16

    check_color         = rgba(158, 206, 106, 1.0)   # Theme.green = #9ece6a
    fail_color          = rgba(247, 118, 142, 1.0)   # Theme.red = #f7768e
    fail_text           = <i>$FAIL</i>

    position  = 0, -280
    halign    = center
    valign    = center
}
