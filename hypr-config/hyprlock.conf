# ════════════════════════════════════════════════════════════════
# hyprlock.conf v6.16.3.2.1 — Vaxry-style redesign
# Path: ~/.config/hypr/hyprlock.conf
# ────────────────────────────────────────────────────────────────
# Design language (mirrors Hyprland's own vaxry-flavored screenshot
# Paul referenced):
#
#   ┌──────────────────────────────────────────────────────┐
#   │                                                      │
#   │            (live desktop wallpaper, blurred)         │
#   │                                                      │
#   │                                                      │
#   │                      ██████                          │   ← clock
#   │                      00:12                           │     huge
#   │                                                      │     centered
#   │              Good evening, paul ✨                   │   ← dynamic
#   │                                                      │     greeting
#   │              ╭────────────────────╮                  │
#   │              │  Input password    │                  │   ← pill input
#   │              ╰────────────────────╯                  │
#   │                                                      │
#   └──────────────────────────────────────────────────────┘
#
# Key changes vs v6.16.3.2:
#   + LIVE wallpaper background — reads symlink populated by
#     ~/.local/bin/zen-lock.sh from WallpaperServiceV5's
#     wallpaper-v5.json. NOT a screenshot anymore — actual wallpaper
#     file means lock looks identical to your desktop, even if you
#     have windows open at lock time.
#   + Big centered Google-Material-You-style clock, thin sans-serif,
#     ~150px tall. Same vibe as the desktop ZenClock widget.
#   + Dynamic greeting line below clock:
#       "Good morning, $USER ☀️"     (5am-12pm)
#       "Good afternoon, $USER 🌤️"   (12pm-5pm)
#       "Good evening, $USER 🌙"     (5pm-10pm)
#       "Working late, $USER ☕"     (10pm-5am)
#     Optionally weather-aware: if ~/.cache/zen-shell/weather.json
#     has a `condition` field of Rain/Snow/Storm, the greeting
#     swaps to "rainy evening" / "snowy morning" / etc.
#   + Pill-shaped password input at the bottom — matches the
#     vaxry screenshot pill aesthetic.
#   + Theme palette still Tokyo-Night defaults (will become
#     auto-regenerated from active scheme in a future release).
# ════════════════════════════════════════════════════════════════
# Wala tayong binawasan — every section from v6.16.3.2 either
# kept or upgraded. No design element removed.
# ════════════════════════════════════════════════════════════════

general {
    grace                  = 0          # require password immediately
    hide_cursor            = false      # hf98c: cursor MUST be visible or the
                                        # clickable Shutdown/Restart buttons
                                        # can't be aimed/clicked at all.
    no_fade_in             = false
    disable_loading_bar    = true
}

# ── Background — live desktop wallpaper ──
# The path points to a symlink that ~/.local/bin/zen-lock.sh updates
# every time the lock screen is invoked, pointing it at whatever
# WallpaperServiceV5 currently has set as .currentWallpaper. So
# the lock screen always matches your live desktop wallpaper.
background {
    monitor    =
    path       = $HOME/.cache/zen-shell/lock-wallpaper.png
    blur_passes  = 3
    blur_size    = 7
    noise        = 0.0117
    contrast     = 0.85
    brightness   = 0.55                  # darker than v6.16.3.2 for
                                         # vaxry-style readability
    vibrancy     = 0.21
    vibrancy_darkness = 0.0
}

# ────────────────────────────────────────────────────────────────
# CLOCK — big centered, Google Material You vibe
# ────────────────────────────────────────────────────────────────
# Position: dead center of screen (0,0 in halign/valign center mode).
# Update every second so the colon doesn't appear stuck.
#
# v6.16.3.6: font_family line is tagged with ZEN_FONT_OVERRIDE_CLOCK —
# zen-lock.sh rewrites it at lock time to match the bar's font
# (Settings → Bar Modules → Font family). Remove the tag marker
# from this line if you want to pin a custom font that Zen Shell
# should leave alone.
label {
    monitor   =
    text      = cmd[update:1000] echo "$(date '+%H:%M')"
    font_size = 152
    font_family = Adwaita Sans Black    # ZEN_FONT_OVERRIDE_CLOCK
    color     = rgba(255, 255, 255, 0.96)
    position  = 0, 50
    halign    = center
    valign    = center
}

# ────────────────────────────────────────────────────────────────
# hf98c — GREETING LINE (below the clock)
# ────────────────────────────────────────────────────────────────
# Paul: "sa taas, after ng clock, dapat may Hi, yun username."
# Time-aware greeting + capitalised username, e.g.:
#   "Good morning, Paul ☀️"   "Good afternoon, Paul 🌤️"
#   "Good evening, Paul 🌙"    "Working late, Paul ☕"
# Logic lives in ~/.local/bin/zen-lock-message.sh (mode: greet), same
# pure-bash script as the weather/care lines below. Sits between the
# clock (y=50) and the weather mood line (y=-100). Want a plain "Hi,
# Paul" instead? Change `greet` -> `greet hi` (see the script).
label {
    monitor   =
    text      = cmd[update:60000] $HOME/.local/bin/zen-lock-message.sh greet
    font_size = 24
    font_family = Adwaita Sans    # ZEN_FONT_OVERRIDE_MSG
    color     = rgba(255, 255, 255, 0.94)
    position  = 0, -56
    halign    = center
    valign    = center
}
# ────────────────────────────────────────────────────────────────
# v6.16.3.6 — WEATHER MOOD LINE
# ────────────────────────────────────────────────────────────────
# Small poetic description of the current weather/time mood, shown
# just below the clock. Updates every minute. Examples:
#
#   "Rainy afternoon 🌧️"
#   "Starry night sky 🌌"
#   "Cloudy morning ☁️"
#   "Sunny morning ☀️"
#
# Logic lives in ~/.local/bin/zen-lock-message.sh — reads weather
# condition from ~/.cache/zen-shell/weather.json (WeatherService)
# plus time of day, picks from a bucket of pre-written phrasings.
# The script is pure bash so no QML / Quickshell runtime needed —
# works even if the shell isn't running.
label {
    monitor   =
    text      = cmd[update:60000] $HOME/.local/bin/zen-lock-message.sh weather
    font_size = 22
    font_family = Adwaita Sans    # ZEN_FONT_OVERRIDE_MSG
    color     = rgba(220, 226, 248, 0.92)
    position  = 0, -100
    halign    = center
    valign    = center
}

# ────────────────────────────────────────────────────────────────
# v6.16.3.6 — CARE LINE
# ────────────────────────────────────────────────────────────────
# Rotating well-being message, biased by weather + time bucket.
# Random pick seeded on minute-of-day, so rotates naturally but
# stays stable within any given minute. Examples:
#
#   "Take care of yourself, pre"
#   "Stay cozy — perfect reading weather"
#   "Tea or coffee weather ☕"
#   "Don't stay up too late 🌙"
#   "Hope today's good to you"
#
# Smaller font than the mood line + grey tone, so it reads as a
# secondary thought rather than a headline. Remove the label
# entirely if you prefer a minimal lock screen.
label {
    monitor   =
    text      = cmd[update:60000] $HOME/.local/bin/zen-lock-message.sh care
    font_size = 16
    font_family = Adwaita Sans    # ZEN_FONT_OVERRIDE_MSG
    color     = rgba(180, 192, 220, 0.82)
    position  = 0, -140
    halign    = center
    valign    = center
}

# ────────────────────────────────────────────────────────────────
# PASSWORD INPUT — pill-shaped, centered
# ────────────────────────────────────────────────────────────────
# Width 360 / radius matches half-height for a true pill shape.
# Outline color = Theme.blue (Tokyo-Night). Fill = bg1 at 65%
# alpha for that frosted look over the blurred wallpaper.
input-field {
    monitor             =
    size                = 360, 60
    outline_thickness   = 2
    dots_size           = 0.26
    dots_spacing        = 0.36
    dots_center         = true
    rounding            = 30                       # full pill (size.h/2)

    outer_color         = rgba(122, 162, 247, 0.85)   # Theme.blue @ 85%
    inner_color         = rgba(36, 40, 59, 0.65)      # Theme.bg1 @ 65%
    font_color          = rgba(220, 226, 248, 1.0)    # Theme.fg

    fade_on_empty       = false
    placeholder_text    = <i><span foreground="##94a3c2">  Input password</span></i>
    hide_input          = false

    check_color         = rgba(158, 206, 106, 1.0)    # Theme.green
    fail_color          = rgba(247, 118, 142, 1.0)    # Theme.red
    fail_text           = <i>$FAIL</i>

    position  = 0, -200
    halign    = center
    valign    = center
}

# ────────────────────────────────────────────────────────────────
# Optional: small caps lock indicator (only visible if engaged)
# ────────────────────────────────────────────────────────────────
label {
    monitor   =
    text      = cmd[update:500] bash -c '\
        if command -v xset >/dev/null 2>&1 && xset q 2>/dev/null | grep -q "Caps Lock:.*on"; then \
            echo "⇪ CAPS LOCK"; \
        else \
            echo ""; \
        fi'
    font_size = 14
    font_family = Adwaita Sans
    color     = rgba(247, 118, 142, 0.85)        # Theme.red
    position  = 0, -270
    halign    = center
    valign    = center
}

# ════════════════════════════════════════════════════════════════
# v7.0.0-beta.1-hf98c — POWER CONTROLS (shutdown / restart)
# ────────────────────────────────────────────────────────────────
# Paul: "yun hyprlock lagay tayo ng shutdown button or restart sa ibaba."
#
# hf98c changes vs hf98b (from Paul's lock-screen screenshot):
#   • ICONS INLINE, NOT FLOATING. The separate icon labels above the
#     pills rendered clipped ("hindi buo / parang high dashes"), because
#     a large standalone Nerd Font Material glyph overflows hyprlock's
#     text box. Now the icon sits INLINE with the word inside one label,
#     in JetBrainsMono Nerd Font at text size — it renders whole and
#     reads as one tidy button. No more floating marks.
#   • THEME-AWARE COLORS. Every color below is tagged with a
#     "ZEN_COLOR_OVERRIDE" key:alpha marker (see the live lines below).
#     On each lock,
#     zen-lock.sh reads the ACTIVE theme (current-theme.json) and
#     rewrites these to rgba(<themehex><alpha>) — so the buttons follow
#     whatever scheme is live (Tokyo-Night, Gruvbox, Catppuccin, matugen…)
#     instead of the hardcoded values. The hardcoded rgba() here is just
#     the fallback used before the first sync / if the theme file is
#     missing. (Keys: bg1, fg, red, blue — see current-theme.json.)
#
# Clickability: hyprlock makes `shape` clickable via `onclick`; the SHAPE
# carries the command (big hit area), the label is visual only. Requires
# hyprlock > v0.7.0 — Paul is on v0.9.5, so supported. (Also: hide_cursor
# is now false up top, or the cursor can't be aimed at the buttons.)
# Commands mirror StartMenuPanel / PowerConfirmDialog exactly.
#
# Tweak hints: pill = SHAPE position y (70). Text inside = LABEL position
# y (88) — nudge if not centered on your resolution. Wala tayong
# binawasan — every original label above is untouched; this is additive.
# ════════════════════════════════════════════════════════════════

# ── Shutdown button (shape = clickable hit area, themed) ──
shape {
    monitor      =
    size         = 160, 56
    color        = rgba(24283b80)                # ZEN_COLOR_OVERRIDE:bg1:80
    rounding     = 28
    border_size  = 2
    border_color = rgba(f7768ebf)                # ZEN_COLOR_OVERRIDE:red:bf
    onclick      = systemctl poweroff
    position     = -90, 70
    halign       = center
    valign       = bottom
    zindex       = 1
}

# ── Shutdown label (icon + word inline, themed text) ──
label {
    monitor     =
    text        = 󰐥  Shutdown
    font_size   = 17
    font_family = JetBrainsMono Nerd Font
    color       = rgba(c0caf5f2)                 # ZEN_COLOR_OVERRIDE:fg:f2
    position    = -90, 88
    halign      = center
    valign      = bottom
    zindex      = 2
}

# ── Restart button (shape = clickable hit area, themed) ──
shape {
    monitor      =
    size         = 160, 56
    color        = rgba(24283b80)                # ZEN_COLOR_OVERRIDE:bg1:80
    rounding     = 28
    border_size  = 2
    border_color = rgba(7aa2f7bf)                # ZEN_COLOR_OVERRIDE:blue:bf
    onclick      = systemctl reboot
    position     = 90, 70
    halign       = center
    valign       = bottom
    zindex       = 1
}

# ── Restart label (icon + word inline, themed text) ──
label {
    monitor     =
    text        = 󰜉  Restart
    font_size   = 17
    font_family = JetBrainsMono Nerd Font
    color       = rgba(c0caf5f2)                 # ZEN_COLOR_OVERRIDE:fg:f2
    position    = 90, 88
    halign      = center
    valign      = bottom
    zindex      = 2
}
