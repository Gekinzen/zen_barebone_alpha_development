# ═══════════════════════════════════════════════════════════════
# AUTOSTART (v6.16.3.2)
# Path: ~/.config/hypr/modules/autostart.conf
# ═══════════════════════════════════════════════════════════════

# System integration
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Polkit
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Wallpaper daemon (required for Zen wallpaper picker)
exec-once = swww-daemon

# Notifications
exec-once = swaync

# Clipboard history
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Zen Shell
exec-once = quickshell -p ~/.config/quickshell/zen-shell

exec-once = ~/.local/bin/openrgb-autoload.sh

# v6.16.0: Restore the user's saved power profile after login
# Reads ~/.config/quickshell/zen-shell/settings-state-v2.json →
# .system.powerProfile and re-applies it via powerprofilesctl.
# Silent no-op if power-profiles-daemon isn't installed.
exec-once = ~/.local/bin/zen-power-profile-restore.sh

# ═══════════════════════════════════════════════════════════════
# v6.16.3.2 — Idle / lock / suspend daemon
# ═══════════════════════════════════════════════════════════════
# Hypridle handles the timed cascade (5min lock → 6min DPMS off →
# 15min suspend on battery only). Reads ~/.config/hypr/hypridle.conf.
# Silent no-op if hypridle isn't installed (it'll just fail to
# launch and that's fine — manual lock from the StartMenu still
# works because PowerConfirmDialog calls hyprlock directly).
#
# Wala tayong binawasan — every line above this block is unchanged
# from v6.16.2.3.6.
exec-once = hypridle

# Load Hyprland plugins (managed via Settings → Plugins)
# v6.16.4.12.6.44: Use bootstrap script that does:
#   hyprpm reload + sleep + hyprctl reload
# so plugin-registered keywords (hyprbars buttons, hyprexpo binds) are
# parsed AFTER the plugins themselves are loaded. Plain `hyprpm reload`
# alone leaves buttons/binds invisible after re-login.
exec-once = ~/.local/bin/zen-plugin-bootstrap.sh
