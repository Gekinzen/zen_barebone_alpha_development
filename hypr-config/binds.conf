# ═══════════════════════════════════════════════════════════════
# PERSONAL KEYBINDS (core only — Zen Shell keybinds separate)
# Path: ~/.config/hypr/modules/binds.conf
# ═══════════════════════════════════════════════════════════════

$mainMod = SUPER

# ── Window management (core) ──
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, P, pseudo          # dwindle
bind = $mainMod, J, togglesplit     # dwindle

# ── Focus ──
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# ── Special workspace (scratchpad) ──
bind = $mainMod, grave, togglespecialworkspace, magic
bind = $mainMod SHIFT, grave, movetoworkspace, special:magic

# ── Alt+Tab ──
bind = ALT, TAB, cyclenext
bind = ALT SHIFT, TAB, cyclenext, prev

# ── Screenshot (zen-screenshot.sh — active monitor aware) ──
bind = $mainMod, F12, exec, ~/.local/bin/zen-screenshot.sh region
bind = $mainMod SHIFT, F12, exec, ~/.local/bin/zen-screenshot.sh full
bind = , Print, exec, ~/.local/bin/zen-screenshot.sh region
bind = SHIFT, Print, exec, ~/.local/bin/zen-screenshot.sh clipboard
bind = $mainMod CTRL, F12, exec, ~/.local/bin/zen-screenshot.sh allscreens
bind = $mainMod ALT, F12, exec, pkill flameshot || flameshot gui

# Note: Apps, workspaces, wallpaper, themes, power, media, volume,
# brightness, Super+F, Super+G live in:
# ~/.config/quickshell/zen-shell/config/keybinds-update.conf

# ── v6.16.4 — Panic escape hatch (laptop reliability) ──
# Fires zen-panic.sh which runs the full recovery sequence:
# kill frozen hyprlock, DPMS kick, monitor re-enum, swww revive,
# quickshell wake, re-lock cleanly. Press this key combo any time
# you're stuck — on a black screen, frozen lock screen, or zombied
# shell — and the system should come back alive in ~2 seconds.
#
# `bindl` (locked) flag means the keybind fires EVEN WHEN
# HYPRLOCK IS RUNNING. That's the whole point — frozen hyprlock is
# the scenario this was built for.
#
# Manual invoke alternatives:
#   - SSH from another device: `~/.local/bin/zen-panic.sh`
#   - TTY (Ctrl+Alt+F2): same command after loginctl session-switch
bindl = $mainMod SHIFT CTRL, Escape, exec, ~/.local/bin/zen-panic.sh
