# ═══════════════════════════════════════════════════════════════
# PERSONAL KEYBINDS (core only — Zen Shell keybinds separate)
# Path: ~/.config/hypr/modules/binds.conf
# ═══════════════════════════════════════════════════════════════

$mainMod = SUPER

# ── Window management (core) ──
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, P, pseudo                       # dwindle pseudo (still works as a dispatcher in 0.55+)
# v7.0.0-beta.1-hf82l — Hyprland 0.54 removed the direct `togglesplit`
# dispatcher; must be invoked via `layoutmsg` now. The new form works
# on 0.53 and earlier too (layoutmsg has always accepted togglesplit
# as a sub-command), so this is safe across versions.
bind = $mainMod, J, layoutmsg, togglesplit       # dwindle (was: togglesplit, removed in 0.54)

# ── Focus ──
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# ── Special workspace (scratchpad) ──
bind = $mainMod, grave, togglespecialworkspace, magic
bind = $mainMod SHIFT, grave, movetoworkspace, special:magic

# ── Alt+Tab ──
bind = ALT, TAB, cyclenext
bind = ALT SHIFT, TAB, cyclenext, prev

# ── Screenshot (zen-screenshot.sh — active monitor aware) ──
bind = $mainMod, F12, exec, ~/.local/bin/zen-screenshot.sh region
bind = $mainMod SHIFT, F12, exec, ~/.local/bin/zen-screenshot.sh full
bind = , Print, exec, ~/.local/bin/zen-screenshot.sh region
bind = SHIFT, Print, exec, ~/.local/bin/zen-screenshot.sh clipboard
bind = $mainMod CTRL, F12, exec, ~/.local/bin/zen-screenshot.sh allscreens
bind = $mainMod ALT, F12, exec, pkill flameshot || flameshot gui

# Note: Apps, workspaces, wallpaper, themes, power, media, volume,
# brightness, Super+F, Super+G live in:
# ~/.config/quickshell/zen-shell/config/keybinds-update.conf

# ── v6.16.4 — Panic escape hatch (laptop reliability) ──
# Fires zen-panic.sh which runs the full recovery sequence:
# kill frozen hyprlock, DPMS kick, monitor re-enum, swww revive,
# quickshell wake, re-lock cleanly. Press this key combo any time
# you're stuck — on a black screen, frozen lock screen, or zombied
# shell — and the system should come back alive in ~2 seconds.
#
# `bindl` (locked) flag means the keybind fires EVEN WHEN
# HYPRLOCK IS RUNNING. That's the whole point — frozen hyprlock is
# the scenario this was built for.
#
# Manual invoke alternatives:
#   - SSH from another device: `~/.local/bin/zen-panic.sh`
#   - TTY (Ctrl+Alt+F2): same command after loginctl session-switch
bindl = $mainMod SHIFT CTRL, Escape, exec, ~/.local/bin/zen-panic.sh

# ── v7.0.0-alpha.6-hf2 — Karui · Search + Clipboard ──
# Spotlight-style settings search overlay (Settings + Hypr Control Center
# entries searchable from anywhere). Toggle with Ctrl+Shift+F system-wide.
#
# v7.0.0-alpha.15: Changed from Ctrl+F → Ctrl+Shift+F to free up Ctrl+F
# for the universal "find in document/page" shortcut used by browsers,
# code editors, and other apps. Spotlight still accessible via Super+Space
# (primary) or Ctrl+Shift+F (secondary).
bind = CTRL SHIFT, F, exec, qs -c zen-shell ipc call zen toggleSearch
# v7.0.0-alpha.9 — Super+Space alias (Spotlight-style invocation pattern)
# Same overlay as Ctrl+Shift+F, two keybind entry points for muscle memory
# parity with macOS Spotlight + GNOME Activities.
bind = $mainMod, Space, exec, qs -c zen-shell ipc call zen toggleSearch

# Clipboard history panel (cliphist-backed). Toggle with Super+V.
# Click rows to paste; right-click for pin/delete; auto-closes after paste.
bind = $mainMod, V, exec, qs -c zen-shell ipc call zen toggleClipboard

# v7.0.0-alpha.14: Workspace Overview — Exposé-style grid of all
# active workspaces. Click any tile to switch. Esc closes.
# Also triggered by bottom-left hot corner (HotCornerService default).
bind = $mainMod, Tab, exec, qs -c zen-shell ipc call zen toggleWorkspaceOverview

# ── Zen Quick Terminal (Yakuake-style drop-down) v7.0.0-beta.1-hf95.13 ──
# Super+Shift+T toggles a drop-down Alacritty that slides in from the top.
# Uses a SEPARATE config (~/.config/alacritty-quick), so your normal
# Alacritty is unaffected.
bind = $mainMod SHIFT, T, exec, ~/.local/bin/zen-quickterm.sh
