# ═══════════════════════════════════════════════════════════════════════════════
# Zen Shell — Monitor Configuration (Hyprland 0.54+ monitorv2 syntax)
# Path: ~/.config/hypr/monitors.conf
# Source from hyprland.conf with: source = ~/.config/hypr/monitors.conf
#
# IMPORTANT — STATELESS FALLBACK ONLY
#   This file used to define per-monitor static configs (eDP-1 / HDMI-A-1 /
#   DP-1 with hardcoded transforms etc). Yun static approach broke when:
#     • Connector names differ from defaults (Lenovo on HDMI-A-1, not DP-1)
#     • You wanted per-topology rotations remembered
#     • Manual changes via nwg-displays got reverted on `hyprctl reload`
#
#   Sa v2 setup, the canonical config now lives in:
#     ~/.config/hypr/monitor-profiles/<topology-key>.conf
#
#   ...managed by zen-monitor-watcher.sh. This file (monitors.conf) only
#   has a SINGLE catch-all fallback rule that applies to ANY connected
#   output when no profile is saved yet for the current topology — gives
#   you a safe, sensible default until you customize via nwg-displays
#   (or Zen Shell Settings → Displays) and yun watcher saves it.
# ═══════════════════════════════════════════════════════════════════════════════

# Catch-all fallback — applies to every connector with no specific rule.
# `preferred,auto,1` = best resolution, auto-laid-out, no scaling.
monitorv2 {
    output =
    mode = preferred
    position = auto
    scale = 1
}
