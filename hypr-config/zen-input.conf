# ═══════════════════════════════════════════════════════════════════════════
# Zen Shell — keyboard-independent media keys + login autostart
#   v8.0.0-alpha-hf192 · Karui (軽い)
#
# Installed and sourced automatically by install.sh — you do not add anything
# to hyprland.conf by hand. The installer copies this file to
# ~/.config/hypr/ and appends the `source =` line if it is not already there,
# so re-running the installer repairs it rather than duplicating it.
#
# It lands at the END of hyprland.conf, which means these binds WIN over
# anything above them. That is intentional for the media keys — and it is also
# why every SUPER combo below was checked against the binds Zen Shell already
# ships before being made active. See the note above the < / > pair.
#
# ═══════════════════════════════════════════════════════════════════════════
#
# WHY THE BINDS MOVED WHEN THE KEYBOARD DID
#
# "nagchange nako ng keyboard now e EG75, dapat same padin shortcut keys natin
#  kahit anong keyboard."
#
# A bind written as `bind = , code:60, exec, ...` names a PHYSICAL POSITION on
# the matrix. Move to another board and position 60 is a different key, so the
# shortcut silently lands somewhere else. That is the whole failure.
#
# A bind written against a KEYSYM (XF86AudioRaiseVolume) names the MEANING.
# Every keyboard that has a volume key emits that symbol, whether it is a
# dedicated key, an Fn layer, or a media strip — so the same line keeps working
# across boards without being touched.
#
# So: keysyms first, and the Fn+</> pair kept as an explicit SUPER binding that
# does not depend on the board exposing an Fn layer at all.
#
# Check what your EG75 actually emits before assuming:
#     wev            # press the key, read the sym name
#     showkey -k     # or this, on a TTY
#
# ═══════════════════════════════════════════════════════════════════════════


# ── Media keys — work on ANY keyboard that has them ────────────────────────
# bindl = binds even when the screen is locked, which is what you want for
# volume. bindle = the same, plus repeat-on-hold for the ramping keys.

bindle = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+   # hf201: keys are the SAFE range — capped at 100%. Boost (100-300, guarded) is slider-only; pressing vol-up while boosted snaps you back to 100
bindle = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioPause,        exec, playerctl play-pause
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPrev,         exec, playerctl previous

bindle = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindle = , XF86MonBrightnessDown, exec, brightnessctl set 5%-


# ── The Fn + < / > pair, made board-independent ────────────────────────────
#
# On the old board these were an Fn layer over comma and period. Fn layers are
# firmware, not X keysyms — the OS often never sees the Fn press at all, so a
# bind against it cannot be portable. A real modifier is needed.
#
# ⚠ SUPER + comma was the obvious choice and it is NOT AVAILABLE:
#   zen-shell-dashboard.conf already binds it to toggleDashboard. This file is
#   sourced LAST, so binding it here would have silently stolen your dashboard
#   shortcut — the kind of regression you only notice a week later.
#
# SUPER + SHIFT + comma/period is used instead, which on a US layout IS
# SUPER + < and SUPER + > — the same two glyphs your fingers already know.
#
# Both spellings are bound because layouts disagree on whether the shifted key
# reports `comma`/`period` or `less`/`greater`.

bindle = SUPER SHIFT, comma,    exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindle = SUPER SHIFT, period,   exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+   # hf201: keys are the SAFE range — capped at 100%. Boost (100-300, guarded) is slider-only; pressing vol-up while boosted snaps you back to 100
bindle = SUPER SHIFT, less,     exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindle = SUPER SHIFT, greater,  exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+   # hf201: keys are the SAFE range — capped at 100%. Boost (100-300, guarded) is slider-only; pressing vol-up while boosted snaps you back to 100


# ── Panels ─────────────────────────────────────────────────────────────────
# SUPER + C is deliberately NOT here — zen-shell-dashboard.conf owns it, and
# repeating it would mean two files to edit the day you want to change it.
bind = SUPER, slash, exec, qs -c zen-shell ipc call zen toggleKeybindCheatsheet


# ── Opt-in ─────────────────────────────────────────────────────────────────
# Shipped commented, not active. SUPER + M is a common user bind (monitors,
# music, mute — everyone picks something), and because this file is sourced
# last it would override yours without a word. XF86AudioMute above already
# covers mute on any keyboard that has the key. Uncomment only if you want it.
#
# bindl = SUPER, M, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle


# ═══════════════════════════════════════════════════════════════════════════
# AUTOSTART
#
# exec-once runs at session start only — not on every `hyprctl reload`, which
# `exec` would do, and which is how you end up with four EasyEffects.
# ═══════════════════════════════════════════════════════════════════════════

# EasyEffects — starts hidden in the tray, DSP chain active immediately.
exec-once = easyeffects --gapplication-service

# If you would rather have it managed by systemd (survives a Hyprland restart,
# and restarts itself if it crashes), use this instead of the line above:
#
#     systemctl --user enable --now easyeffects
#
# Both work. Do not do both, or you get two instances fighting over the sink.


# ═══════════════════════════════════════════════════════════════════════════
# hf197 — zen-callwatch v2 (call-popup reaper, rewritten)
#
# The hf196 daemon closed Zoom/Teams/Lark windows on ANY title transition —
# which also killed the post-call prompt right after you clicked End Call,
# and killed the call itself when opening video settings retitled the window.
# v2 only arms on an ENDED title, waits a 25s grace, and DISARMS the moment
# the window gains focus (you're clicking the prompt). closewindow still
# reaches frozen render processes because the app's MAIN process handles it.
# ═══════════════════════════════════════════════════════════════════════════
exec-once = $HOME/.config/quickshell/zen-shell/scripts/zen-callwatch.sh

# Manual dismiss — instantly closes unfocused floating call popups.
bind = SUPER SHIFT, C, exec, $HOME/.config/quickshell/zen-shell/scripts/zen-callwatch.sh close
