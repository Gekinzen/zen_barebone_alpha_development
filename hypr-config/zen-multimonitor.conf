# Zen Shell v7.0.0-beta.1-hf8 — Multi-monitor input fixes
#
# This file fixes the common multi-monitor pain points:
#
#   1. Cursor follows focus across monitors (no more "type doesn't work
#      on second monitor unless I drag a window first")
#
#   2. Focus-on-activate so newly-opened apps grab keyboard focus even
#      on a different monitor than the one you're hovering
#
#   3. Cursor doesn't warp out from under you on workspace switches
#
# Source this from your main hyprland.conf:
#   source = ~/.config/hypr/zen-multimonitor.conf
#
# Or copy these lines into any existing config — they're all standalone.
# Wala kang dapat ialis sa existing config mo, additive only.

# ──────────────────────────────────────────────────────────────
# Input: keyboard focus follows mouse across monitors
# ──────────────────────────────────────────────────────────────
input {
    # Click anywhere → focus that window even across monitors.
    # Without this, second-monitor clicks may register but keyboard
    # input stays trapped on the previous monitor.
    follow_mouse = 1

    # Cursor moving between monitors brings focus along automatically
    # (default 0 means "click required"; 1 means "hover is enough")
    mouse_refocus = true
}

# ──────────────────────────────────────────────────────────────
# General: focus-on-activate (newly mapped windows grab focus)
# ──────────────────────────────────────────────────────────────
general {
    # When an app spawns on another monitor, focus jumps there
    # instead of leaving you typing into the previous monitor's window.
}

# ──────────────────────────────────────────────────────────────
# Misc: cursor warping behavior
# ──────────────────────────────────────────────────────────────
misc {
    # Don't teleport cursor on workspace switches — keep it where
    # the user put it. Less disorienting on multi-monitor setups.
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true

    # Auto-activate windows that ask for focus instead of just
    # flashing them in the taskbar
    focus_on_activate = true
}

# ──────────────────────────────────────────────────────────────
# Cursor: prevent unwanted warping out of monitor on focus
# ──────────────────────────────────────────────────────────────
cursor {
    # When true (default), cursor teleports to the focused workspace's
    # center on workspace switch. Setting false keeps cursor stable —
    # essential for multi-monitor where each monitor has its own
    # workspace and you don't want the cursor jumping screens.
    no_warps = false

    # Hide cursor while typing (small QoL)
    hide_on_key_press = true
}
