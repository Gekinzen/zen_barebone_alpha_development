# ═══════════════════════════════════════════════════════════════
# LID BEHAVIOR (v6.16.3.2)
# Path: ~/.config/hypr/modules/lid-behavior.conf
# ═══════════════════════════════════════════════════════════════
#
# Handles laptop lid open/close events. Behavior controlled by
# ~/.config/quickshell/zen-shell/settings-state-v2.json
# → .system.lidCloseBehavior  ("smart" | "mirror" | "keep" | "off")
#
# Default in v6.16.3.2 is "smart":
#   Lid CLOSE
#     ├─ External monitor present → clamshell (disable eDP only)
#     ├─ No external + AC plugged → lock + DPMS off (no suspend)
#     └─ No external + on battery → lock + suspend
#   Lid OPEN
#     └─ Run full recovery pipeline (DPMS kick, swww restart,
#        hyprlock unjam, monitor re-enum, workspace bounce)
#
# Legacy modes preserved:
#   mirror — old default (clamshell-or-suspend, no AC awareness)
#   keep   — do nothing on close (for docked-stand workflows)
#   off    — always disable internal on close
#
# These are bindl (locked) binds so they fire even on the lockscreen.
# ═══════════════════════════════════════════════════════════════
# v6.16.3.2 changes:
#   + Added manual recovery keybind (SUPER+SHIFT+W) — runs the
#     resume handler on demand. Useful when you wake without a
#     lid event (keyboard wake, dock unplug, etc.) and the
#     systemd-sleep hook didn't fire or didn't fully recover.
#   + Lid binds unchanged (still bindl, still call zen-lid-handler.sh)
# ═══════════════════════════════════════════════════════════════

# ── Lid switch binds ──
bindl = , switch:on:Lid,  exec, ~/.local/bin/zen-lid-handler.sh close
bindl = , switch:off:Lid, exec, ~/.local/bin/zen-lid-handler.sh open

# ── Fallback: some kernels emit "Lid Switch" (with space) ──
bindl = , switch:on:"Lid Switch",  exec, ~/.local/bin/zen-lid-handler.sh close
bindl = , switch:off:"Lid Switch", exec, ~/.local/bin/zen-lid-handler.sh open

# ── Manual recovery hotkey (v6.16.3.2 NEW) ──
# If wake recovery didn't fully fire (e.g., systemd hook not
# installed, or wake came via keyboard with no lid event), this
# triggers the same pipeline manually. Mnemonic: W = Wake.
bind = SUPER SHIFT, W, exec, ~/.local/bin/zen-resume-handler.sh
