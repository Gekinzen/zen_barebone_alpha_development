# ═══════════════════════════════════════════════════════════════
# LID BEHAVIOR (v6.16.0)
# Path: ~/.config/hypr/modules/lid-behavior.conf
# ═══════════════════════════════════════════════════════════════
#
# Handles laptop lid open/close events. Behavior controlled by
# ~/.config/quickshell/zen-shell/settings-state-v2.json
# → .system.lidCloseBehavior ("mirror" | "keep" | "off")
#
# Default is "mirror":
#   - Close lid + external connected → disable eDP-1, external
#     keeps rendering uninterrupted.
#   - Close lid + no external → suspend system.
#   - Open lid → re-enable eDP-1.
#
# "keep" disables lid handling entirely (internal stays on with
# lid closed — useful when laptop is docked under a stand).
# "off" is classic hyprctl behavior (always disable on close,
# even without external).
#
# These are bindl (locked) binds so they fire even on the lockscreen.
# ═══════════════════════════════════════════════════════════════

bindl = , switch:on:Lid,  exec, ~/.local/bin/zen-lid-handler.sh close
bindl = , switch:off:Lid, exec, ~/.local/bin/zen-lid-handler.sh open

# ── Fallback: some kernels emit "Lid Switch" (with space) ──
bindl = , switch:on:"Lid Switch",  exec, ~/.local/bin/zen-lid-handler.sh close
bindl = , switch:off:"Lid Switch", exec, ~/.local/bin/zen-lid-handler.sh open
