# ~/.config/hypr/zen-shell-look.conf
# ─────────────────────────────────────────────────────────────
# Zen Shell — Glass look layer blur (v7.0.0-beta.1-hf99zr)
#
# Blurs every zen-shell-* layer surface (bar, dock, control panel, start
# menu, notifications, toasts, OSD, dashboard). Whether the frost is
# *visible* is controlled by the Shell Look's panel opacity:
#   • Glass — transparent  → frosted glass shows through
#   • Zen / Classic — opaque → blur is hidden (no visual change)
#
# ── SYNTAX NOTE (Hyprland 0.55 changed layerrule) ────────────
# 0.55+ : each element is "key value" (space-separated), matchers use a
#         match: prefix, and `ignorealpha` was renamed `ignore_alpha`:
#             layerrule = blur 1, ignore_alpha 0.35, match:namespace ^(zen-shell-.*)$
# 0.54- : the old comma form:
#             layerrule = blur, zen-shell-
#             layerrule = ignorealpha 0.35, zen-shell-
#
# The 0.55 form is active below. On Hyprland 0.54 or older, comment it and
# uncomment the LEGACY block. (The shell also applies these at runtime via
# hyprctl and auto-detects which syntax your Hyprland accepts, so pop-ups
# frost either way; this file keeps the persistent Bar/Dock frosted across
# a Hyprland restart.)
#
# ENABLE (once): add to ~/.config/hypr/hyprland.conf, then `hyprctl reload`:
#     source = ~/.config/hypr/zen-shell-look.conf
# (install.sh copies this file and adds that line for you.)
# ─────────────────────────────────────────────────────────────

# ── Hyprland 0.55+ ──
layerrule = blur 1, ignore_alpha 0.35, match:namespace ^(zen-shell-.*)$

# ── LEGACY: Hyprland 0.54 and older (uncomment if needed) ──
# layerrule = blur, zen-shell-
# layerrule = ignorealpha 0.35, zen-shell-
