# ═══════════════════════════════════════════════════════════════
# ZEN SHELL — Layer Rules (Hyprland 0.53+)
# ═══════════════════════════════════════════════════════════════

layerrule {
    name = zen-bar-blur
    match:namespace = zen-shell-bar
    blur = true
    ignore_alpha = 0.5
}

layerrule {
    name = zen-startmenu-blur
    match:namespace = zen-shell-startmenu
    blur = true
    ignore_alpha = 0.3
}

layerrule {
    name = zen-wallpaper-blur
    match:namespace = zen-shell-wallpaper
    blur = true
    ignore_alpha = 0.3
}

layerrule {
    name = zen-powerconfirm-blur
    match:namespace = zen-shell-powerconfirm
    blur = true
    ignore_alpha = 0.3
}

# ── v5: Settings window (Event Horizon style) ──
layerrule {
    name = zen-settings-blur
    match:namespace = zen-shell-settings
    blur = true
    ignore_alpha = 0.3
}

# ── Flameshot note ──
# Flameshot overlay is handled via windowrulev2, not layerrule.
# Add to your hyprland.conf if flameshot has issues:
#   windowrulev2 = noanim, title:^(flameshot)
#   windowrulev2 = float, title:^(flameshot)
#   windowrulev2 = move 0 0, title:^(flameshot)
#   windowrulev2 = pin, title:^(flameshot)
