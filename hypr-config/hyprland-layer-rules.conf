# ═══════════════════════════════════════════════════════════════
# ZEN SHELL — Layer Rules + Window Rules
# Hyprland 0.54+ syntax (new format since 0.53)
#
# layerrule: `layerrule = prop value, match:namespace name`
# windowrule: `windowrule = prop value, match:title ^(regex)`
#
# windowrulev2 is DEPRECATED since 0.53 — do NOT use.
# Old layerrule { name = ... } block format still works but
# anonymous one-liners are cleaner for simple rules.
# ═══════════════════════════════════════════════════════════════

# ── Bar blur ──
layerrule = blur on, ignore_alpha 0.5, match:namespace zen-shell-bar

# ── Start menu blur ──
layerrule = blur on, ignore_alpha 0.3, match:namespace zen-shell-startmenu

# ── Wallpaper picker blur ──
layerrule = blur on, ignore_alpha 0.3, match:namespace zen-shell-wallpaper

# ── Power confirm blur ──
layerrule = blur on, ignore_alpha 0.3, match:namespace zen-shell-powerconfirm

# ── Settings window (Event Horizon style) ──
layerrule = blur on, ignore_alpha 0.3, match:namespace zen-shell-settings

# ── v6.13: Control Panel (Quick Settings popup) ──
layerrule = blur on, ignore_alpha 0.3, match:namespace zen-shell-controlpanel

# ── v6.13: Calendar popup (clock click) ──
layerrule = blur on, ignore_alpha 0.3, match:namespace zen-shell-calendar

# ── v6.14: SysRow tooltip is now a PopupWindow (no layer rule needed) ──

# ── v6.15: Zen Strings floating overlay ──
# Transparent surface hovering over the music slot. No blur (would
# look odd on transparent curves). No input needed — mouse passes
# through to the bar's MusicStrings MouseArea underneath for tooltip.
# Hyprland 0.54+: `noanim` renamed to `no_anim on`
layerrule = no_anim on, match:namespace zen-shell-strings

# ── v6.12: Flameshot Wayland window rules ──
# Without these, flameshot GUI can appear on the wrong monitor,
# get animations, or end up behind other windows.
windowrule = float true, match:title ^(flameshot)
windowrule = no_anim on, match:title ^(flameshot)
windowrule = pin on, match:title ^(flameshot)
windowrule = stay_focused on, match:title ^(flameshot)
windowrule = suppress_event fullscreen, match:title ^(flameshot)

# ─────────────────────────────────────────────────────────────────
# v6.16.4.12.6.17 → .18 — Zen Quickprompt (Super+Shift+Return drop-down terminal)
# ─────────────────────────────────────────────────────────────────
# Drop-down terminal for one-shot commands, anchored to top-center
# of the focused monitor. Spawned via ~/.local/bin/zen-quickprompt.sh
# (which sets --class zen-quickprompt). Re-pressing Super+Shift+Return
# focuses an existing instance OR closes it if currently focused.
#
# v6.16.4.12.6.18 syntax fixes for Hyprland 0.54+:
#   - `noborder on` (REMOVED in PR #12269) → `border_size 0`
#   - `no_anim off` (dropped — default IS animations enabled, so we
#     just don't add a no_anim line at all to keep them on)
#   - Everything else (float, pin, size, move, stay_focused,
#     rounding, opacity, suppress_event) still valid.
windowrule = float true,                  match:class ^(zen-quickprompt)$
windowrule = pin on,                      match:class ^(zen-quickprompt)$
windowrule = size 1000 350,               match:class ^(zen-quickprompt)$
windowrule = move 50% 24,                 match:class ^(zen-quickprompt)$
windowrule = stay_focused on,             match:class ^(zen-quickprompt)$
windowrule = border_size 0,                match:class ^(zen-quickprompt)$
windowrule = rounding 14,                 match:class ^(zen-quickprompt)$
windowrule = opacity 0.96 0.92,           match:class ^(zen-quickprompt)$
windowrule = suppress_event fullscreen,   match:class ^(zen-quickprompt)$



# ── Zen Quick Terminal (top-center pop-up) v7.0.0-beta.1-hf95.15 ──
# A floating Alacritty (--class zen-quickterm) on the special:quickterm
# workspace, popping up at the TOP-CENTER of the screen (horizontally
# centered, anchored near the top edge). Separate from your normal
# Alacritty.
windowrule = float true,                  match:class ^(zen-quickterm)$
windowrule = size 1100 600,               match:class ^(zen-quickterm)$
# `move` positions the window's TOP-LEFT corner, so to center a 1100px-
# wide window horizontally we offset by half its width: 50% - 550px.
# Y = 40px from the top edge → top-center pop-up.
windowrule = move 50%-550 40,             match:class ^(zen-quickterm)$
windowrule = animation popin 90%,         match:class ^(zen-quickterm)$
windowrule = rounding 12,                 match:class ^(zen-quickterm)$
# hf95.18: NOTE on hiding the title bar — we intentionally do NOT put a
# `hyprbars:no_bar` / `nobar` windowrule here. Per HyprbarsService, any
# `hyprbars:*` windowrule throws "config option does not exist" whenever
# the plugin ISN'T loaded — and this static file is always parsed. The
# earlier `plugin:hyprbars:bar_height 0` form was invalid for the same
# class of reason. HyprbarsService already owns no-bar rules and emits
# them ONLY when the plugin is verified loaded (gated on pluginLoaded),
# so bar suppression for special cases belongs there, not in this
# always-parsed file. A floating special-workspace pop-up like this also
# doesn't get a bar by default, so no rule is needed here.
windowrule = border_size 2,               match:class ^(zen-quickterm)$
windowrule = opacity 0.97 0.93,           match:class ^(zen-quickterm)$
windowrule = pin on,                      match:class ^(zen-quickterm)$
windowrule = suppress_event fullscreen,   match:class ^(zen-quickterm)$
