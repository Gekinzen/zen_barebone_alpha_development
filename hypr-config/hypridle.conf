// ════════════════════════════════════════════════════════════════
// hypridle.conf v6.16.3.2.1 — Idle / Lock / Sleep cascade
// Path: ~/.config/hypr/hypridle.conf
// ────────────────────────────────────────────────────────────────
// Wired by: hypr-config/autostart.conf → exec-once = hypridle
//
// Cascade timing (mirrors GNOME/KDE defaults so it feels familiar):
//   5  min idle → lock screen (via zen-lock.sh wrapper)
//   6  min idle → DPMS off
//   15 min idle (on battery only) → systemd suspend
//
// On AC (e.g., Paul's docked Lenovo), the cascade STOPS at DPMS off.
// Suspend on AC almost always pisses people off because it kills
// long-running tasks (builds, downloads, IPC sessions).
//
// ────────────────────────────────────────────────────────────────
// Changes vs v6.16.3.2:
//   + lock_cmd / before_sleep_cmd now route through
//     ~/.local/bin/zen-lock.sh instead of `hyprlock` directly. The
//     wrapper syncs the lock-screen wallpaper symlink to the
//     current desktop wallpaper before launching hyprlock — so the
//     lock background always matches what you see on your desktop.
//   + Falls back gracefully: if hyprlock is missing, zen-lock.sh
//     falls through to swaylock, then to plain DPMS off.
// Wala tayong binawasan — every listener and timing preserved.
// ════════════════════════════════════════════════════════════════

general {
    // v6.16.3.2.1: route through zen-lock.sh for live wallpaper sync.
    // The `pidof hyprlock || ...` guard prevents stacking lock screens
    // if hypridle re-fires before user unlocks.
    lock_cmd       = pidof hyprlock || ~/.local/bin/zen-lock.sh

    // Run BEFORE the system goes to sleep. Same wrapper for
    // consistency — even though the lid handler may have already
    // locked, the `pidof hyprlock` check makes this idempotent.
    before_sleep_cmd = loginctl lock-session

    // Run when the screen wakes up. First line of recovery —
    // see also zen-resume-handler.sh for the full pipeline.
    after_sleep_cmd = hyprctl dispatch dpms on
}

// ─────────────────────────────────────────────────────────────
// 5 min — lock the screen
// ─────────────────────────────────────────────────────────────
listener {
    timeout      = 300
    on-timeout   = loginctl lock-session
}

// ─────────────────────────────────────────────────────────────
// 6 min — DPMS off (display off, system stays awake)
// ─────────────────────────────────────────────────────────────
listener {
    timeout      = 360
    on-timeout   = hyprctl dispatch dpms off
    on-resume    = hyprctl dispatch dpms on
}

// ─────────────────────────────────────────────────────────────
// 15 min — suspend, BUT only when on battery.
//
// Hypridle doesn't have a built-in "skip when on AC" flag, so we
// inline a guard: check /sys/class/power_supply for any AC online.
// If found, the bash subshell exits without calling systemctl
// suspend.
// ─────────────────────────────────────────────────────────────
listener {
    timeout      = 900
    on-timeout   = bash -c '\
        on_ac=0; \
        for ac in /sys/class/power_supply/A{C,DP}*/online \
                  /sys/class/power_supply/AC/online \
                  /sys/class/power_supply/ACAD/online; do \
            [ -f "$ac" ] || continue; \
            [ "$(cat "$ac")" = "1" ] && on_ac=1 && break; \
        done; \
        [ "$on_ac" = "1" ] || systemctl suspend'
    on-resume    = hyprctl dispatch dpms on
}
