// ════════════════════════════════════════════════════════════════
// hypridle.conf v6.16.3.2 — Idle / Lock / Sleep cascade
// Path: ~/.config/hypr/hypridle.conf
// ────────────────────────────────────────────────────────────────
// Wired by: hypr-config/autostart.conf → exec-once = hypridle
//
// Cascade timing (mirrors GNOME/KDE defaults so it feels familiar):
//   5  min idle → lock screen
//   6  min idle → DPMS off
//   15 min idle (on battery only) → systemd suspend
//
// On AC (e.g., Paul's docked Lenovo), the cascade STOPS at DPMS off.
// Suspend on AC almost always pisses people off because it kills
// long-running tasks (builds, downloads, IPC sessions).
//
// The on-resume command is intentionally redundant with the
// systemd-sleep hook AND the lid-handler open path — three layers
// of belt-and-suspenders. The hyprctl dispatch dpms on here is
// the FIRST recovery step that fires, before user input even
// reaches the compositor. Hyprland calls this at hypridle's own
// resume detection.
//
// ────────────────────────────────────────────────────────────────
// Changes vs nothing (this file is NEW in v6.16.3.2):
//   + Adds proper idle/lock chain that didn't exist before
//   + Wakes-up command does its own DPMS kick
//   + AC-aware suspend (skips suspend when plugged in)
// ════════════════════════════════════════════════════════════════

general {
    // What to run before locking (for save-state hooks, etc).
    // We don't have any so this is a no-op.
    lock_cmd       = pidof hyprlock || hyprlock

    // Run BEFORE the system goes to sleep. The lid handler may
    // or may not have already locked us — `pidof hyprlock` makes
    // this idempotent.
    before_sleep_cmd = loginctl lock-session

    // Run when the screen wakes up. First line of recovery.
    after_sleep_cmd = hyprctl dispatch dpms on
}

// ─────────────────────────────────────────────────────────────
// 5 min — lock the screen
// ─────────────────────────────────────────────────────────────
listener {
    timeout      = 300
    on-timeout   = loginctl lock-session
}

// ─────────────────────────────────────────────────────────────
// 6 min — DPMS off (display off, system stays awake)
// ─────────────────────────────────────────────────────────────
listener {
    timeout      = 360
    on-timeout   = hyprctl dispatch dpms off
    on-resume    = hyprctl dispatch dpms on
}

// ─────────────────────────────────────────────────────────────
// 15 min — suspend, BUT only when on battery.
//
// Hypridle doesn't have a built-in "skip when on AC" flag, so we
// inline a guard: check /sys/class/power_supply for any AC online.
// If found, the bash subshell exits without calling systemctl
// suspend.
// ─────────────────────────────────────────────────────────────
listener {
    timeout      = 900
    on-timeout   = bash -c '\
        on_ac=0; \
        for ac in /sys/class/power_supply/A{C,DP}*/online \
                  /sys/class/power_supply/AC/online \
                  /sys/class/power_supply/ACAD/online; do \
            [ -f "$ac" ] || continue; \
            [ "$(cat "$ac")" = "1" ] && on_ac=1 && break; \
        done; \
        [ "$on_ac" = "1" ] || systemctl suspend'
    on-resume    = hyprctl dispatch dpms on
}
