# ~/.config/hypr/hypridle.conf
# ─────────────────────────────────────────────────────────────
# Zen Shell — hypridle (idle → lock → screen-off → suspend)
# v7.0.0-beta.1-hf99f
#
# FIX: "after locking / going idle the DISPLAY stays black but audio
# keeps playing, and it never comes back."
#
# Root cause: the screen-off (dpms) listener turned the panel OFF on
# timeout but had no `on-resume` to turn it back ON — so any wake
# (keypress / mouse) left the monitor in DPMS-off. Same story after a
# real suspend without `after_sleep_cmd = ... dpms on`. Audio isn't
# gated by dpms, so sound kept playing over a black screen.
#
# The two CRITICAL lines are marked below. Both must be present.
#
# The `# ZEN_IDLE_LOCK` / `# ZEN_IDLE_SLEEP` marker blocks are what
# zen-hypridle-sync.sh rewrites from panel-state.json (idleLockSeconds /
# idleSleepSeconds). Defaults here mirror the shell: lock at 5 min,
# suspend never. Editing the timeouts by hand is fine too.
# ─────────────────────────────────────────────────────────────

general {
    # Reuse a running hyprlock instead of stacking a new instance.
    lock_cmd         = pidof hyprlock || hyprlock

    # Lock the session right before the machine sleeps.
    before_sleep_cmd = loginctl lock-session

    # CRITICAL #1 — turn the display back ON when we resume from suspend.
    # Without this the panel stays dark after a wake-from-sleep.
    after_sleep_cmd  = hyprctl dispatch dpms on

    ignore_dbus_inhibit = false
}

# ── Lock on idle ──────────────────────────────────────────────
# ZEN_IDLE_LOCK
listener {
    timeout    = 300                    # 5 minutes  (idleLockSeconds)
    on-timeout = loginctl lock-session
}
# ZEN_IDLE_LOCK_END

# ── Screen OFF shortly after lock — WITH a proper wake ────────
listener {
    timeout    = 330                    # 30s after the lock fires
    on-timeout = hyprctl dispatch dpms off

    # CRITICAL #2 — this is the line that turns the display back ON.
    # If it is missing, the screen stays black on the next keypress /
    # mouse move while everything else (incl. audio) keeps running.
    on-resume  = hyprctl dispatch dpms on
}

# ── Suspend on long idle ──────────────────────────────────────
# Disabled by default (idleSleepSeconds = 0 → "never"). To enable,
# uncomment and set a timeout, or set it via Settings and let
# zen-hypridle-sync.sh manage this block.
# ZEN_IDLE_SLEEP
# listener {
#     timeout    = 1800                 # 30 minutes  (idleSleepSeconds)
#     on-timeout = systemctl suspend
# }
# ZEN_IDLE_SLEEP_END
