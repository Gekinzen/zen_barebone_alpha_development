# ─────────────────────────────────────────────────────────────────────────────
# zen-hyprlock-ui.conf — the whole Zen Shell lock-screen centre stack.
#
# Sourced by ONE line in your hyprlock.conf. Apply with
#     zen-hyprlock-doctor --ui        undo:  zen-hyprlock-doctor --undo
#
# Geometry is Paul's, kept as he tuned it (v8.0.0-alpha-hf140).
#
# ── things checked in hyprlock's source, not assumed ─────────────────────────
# · label has NO size and NO padding. The pill is a `shape`; the shape and its
#   label share a position, so the inner padding is symmetric by construction.
# · `##` is hyprlang's escape for a literal `#` (config.cpp:688-716). A bare `#`
#   truncates the line, so the Nerd Font entities are written `&##xf011;`.
# · `text = cmd[...] …` goes to `/bin/sh -c`, and its STDOUT is the label
#   (MiscFunctions.cpp:146). Markup must be PRINTED by the command.
# · cmd[…] options close at `in.find_first_of(']')` — the FIRST bracket
#   (IWidget.cpp:255) — so a `[ … ]` test inside the shell is safe.
# · A trailing `\` continues a line (config.cpp:67).
# · `onclick` exists on label / shape / image from hyprlock 0.9.0. Not on
#   input-field: `CLICKABLE("input-field")` appears ZERO times, and `hide_input`
#   is read once at startup. The eye below is DECORATIVE — hyprlock cannot
#   reveal a typed password at runtime. Set `hide_input = false` if you want the
#   characters shown from the start.
# ─────────────────────────────────────────────────────────────────────────────

$zenIcon  = JetBrainsMono Nerd Font
$zenFont  = Adwaita Sans

# v8.0.0-alpha-hf140 — the clock is the ONE thing that must not be touched.
#
# hf138 set the clock's font_family to $zenFont, i.e. Adwaita Sans. Your clock
# had always used the BLACK weight — install.sh:2195 says so out loud: "zen-lock.sh
# maps fontFamilyId → 'Adwaita Sans Black' / 'Inter Black' … to match the desktop
# widget clock weight." I made the time thin. This is the fix.
$zenClockFont = Adwaita Sans Black

$zenInk   = rgba(255,255,255,0.96)
$zenDim   = rgba(255,255,255,0.66)
$zenLine  = rgba(255,255,255,0.44)
$zenFill  = rgba(255,255,255,0.10)

# v8.0.0-alpha-hf157 — the lock background is your CURRENT desktop wallpaper.
# hyprlock reads a static file (there is no command substitution in `path=`), so
# the wallpaper service keeps this ONE variable pointed at the live wallpaper: it
# rewrites this exact line on every wallpaper switch and once on shell start.
# Kept safe — if $zenWall is ever empty, the `color` below stands in, so the lock
# never comes up broken. A little blur/dim so foreground text stays readable and
# it reads as "lock", not "desktop".
$zenWall  =

background {
    monitor =
    path = $zenWall
    color = rgba(12,12,16,1.0)
    blur_passes = 2
    blur_size = 4
    brightness = 0.92
}

# v8.0.0-alpha-hf141 — the dim is the WHOLE SCREEN, not a card.
#
# hf138 drew an 820x620 rounded `shape`. You saw a box, because it was one.
# A layout value ending in `%` is multiplied by the viewport
# (ConfigDataValues.hpp:48-53), so `size = 100%, 100%` is exactly the monitor.
#
# It cannot swallow the buttons: hyprlock calls onClick on EVERY widget under
# the cursor (hyprlock.cpp:714-717), and CShape::onClick does nothing unless
# `onclick` is set (Shape.cpp:119-122). This scrim has none.
#
# Set the alpha to 0.0 to turn it off, or raise it to taste.
$zenScrim = rgba(0,0,0,0.0)   # v8.0.0-alpha-hf152: OFF by default (was 0.35 — the black wash Paul didn't want). Raise the alpha to dim the wallpaper.

# v8.0.0-alpha-hf143 — "wag masyado ultrawide, dapat may limit, padding lang."
#
# hf141 made the scrim `100%, 100%`. On a 3440px monitor that is a wall of dim
# from bezel to bezel. Percent is viewport-relative, so the wider the screen the
# more of it goes dark — which is precisely the wrong scaling.
#
# It is two variables now. Three presets, pick one:
#
#   full bleed   $zenScrimSize = 100%, 100%   $zenScrimRound = 0
#   padded       $zenScrimSize = 76%, 88%     $zenScrimRound = 64   <- default
#   card         $zenScrimSize = 820, 620     $zenScrimRound = 44
#
# Absolute pixels work too, and are the honest way to cap an ultrawide:
#   $zenScrimSize = 1900, 88%
$zenScrimSize  = 76%, 88%
$zenScrimRound = 64

# v8.0.0-alpha-hf152 — the eye is gone. hyprlock has no password-reveal
# (`hide_input` is read once at startup, and `input-field` has no onclick), so an
# eye could only ever be dead decoration. Removed at Paul's request.

####################################################
# Screen dim  (full monitor, not a box)
####################################################

shape {
    monitor =
    size = $zenScrimSize
    rounding = $zenScrimRound
    border_size = 0
    color = $zenScrim
    position = 0,0
    halign = center
    valign = center
    zindex = 0
}

####################################################
# CLOCK
####################################################

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"

    color = $zenInk
    font_family = $zenClockFont
    font_size = 112

    # v8.0.0-alpha-hf157 — soft shadow so the white clock reads over a bright wallpaper
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0,0,0,0.50)

    position = 0,195

    halign = center
    valign = center

    zindex = 2
}

####################################################
# GREETING
####################################################

label {
    monitor =
    # `id -un` gives "paul", lowercase. The GECOS field usually has the real
    # name; fall back to the login name and capitalise its first letter either
    # way. Tested against paul / Paul / juan-dela-cruz / "Paul Yuki".
    # v8.0.0-alpha-hf154 — five time buckets, not three. Paul: "depende din
    # morning lunch evening late night." Boundaries (24h): 05-10 morning ·
    # 11-13 lunch · 14-17 afternoon · 18-21 evening · 22-23 & 00-04 late night.
    # `date +%H` is base-10-safe in `[ ]` test (getn parses base 10), same as
    # the shipped hf140 greeting; no `$(( ))`, so no octal trap on 08/09.
    text = cmd[update:60000] \
H=$(date +%H); \
if   [ "$H" -ge 5 ]  && [ "$H" -lt 11 ]; then G="Good morning";   E="☀️"; \
elif [ "$H" -ge 11 ] && [ "$H" -lt 14 ]; then G="Good afternoon"; E="🍜"; \
elif [ "$H" -ge 14 ] && [ "$H" -lt 18 ]; then G="Good afternoon"; E="👋"; \
elif [ "$H" -ge 18 ] && [ "$H" -lt 22 ]; then G="Good evening";   E="🌆"; \
elif [ "$H" -ge 22 ];                     then G="Good evening";   E="🌙"; \
else                                           G="Working late";   E="🌙"; fi; \
N=$(getent passwd "$(id -un)" 2>/dev/null | cut -d: -f5 | cut -d, -f1); \
[ -z "$N" ] && N=$(id -un); \
N=${N%% *}; \
F=$(printf %s "$N" | cut -c1 | tr '[:lower:]' '[:upper:]'); \
R=$(printf %s "$N" | cut -c2-); \
printf '%s, %s%s %s' "$G" "$F" "$R" "$E"

    color = $zenInk
    font_family = $zenFont
    font_size = 22

    # v8.0.0-alpha-hf157 — readable over any wallpaper
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0,0,0,0.55)

    position = 0,96

    halign = center
    valign = center

    zindex = 2
}

####################################################
# RANDOM MESSAGE
####################################################

label {
    monitor =

    # v8.0.0-alpha-hf143 — was update:900000. That is FIFTEEN MINUTES
    # (Label.cpp:59 arms a timer for exactly that many ms), so a lock session
    # shorter than a coffee break showed one message and never rotated. 20s.
    # v8.0.0-alpha-hf154 — the pool now matches the greeting's time bucket, so a
    # 3am lock reads different from a 9am one. Same 20s rotation as hf143, same
    # boundaries as the greeting. Every hf152 quote is still here (verbatim) —
    # additive, wala tayong binawas — just sorted into the hours they fit, plus
    # a few time-specific ones. `shuf -n1` picks one from the current bucket.
    # v8.0.0-alpha-hf161 — THIRD time. Every prior version built the pool with
    # `printf '%s\n' … | shuf -n1` inside `$( )`. That combo — a literal \n, a pipe, AND
    # command substitution across hyprlang's line-join — is what broke it; my /bin/sh
    # test only passed because it ran the ALREADY-joined string, bypassing hyprlang. The
    # greeting works because it has none of that. So this is the simplest thing that can
    # possibly work: ONE line, no continuations, no \n, no pipe, no nested $(). `shuf -e
    # -n1` treats each argument as a candidate and prints exactly one.
    # (Time buckets dropped for now to guarantee it renders — one flat inspiring pool.
    #  Once you confirm it shows, I can fold the morning/lunch/evening buckets back in.)
    text = cmd[update:20000] shuf -e -n1 "Progress beats perfection." "Build something amazing today." "Small steps become big achievements." "Keep shipping great work." "Stay focused, keep pushing forward." "Every line of code counts." "Consistency compounds." "Finish strong today." "Great work, rest is part of the build." "Coffee first, then keep shipping." "Wind down, you shipped today." "Fresh start, ease into the day." "Quiet hours, clear mind." "Progress over perfection, always."

    color = $zenDim

    font_family = $zenFont
    font_size = 14

    # v8.0.0-alpha-hf157 — shadow so the daily line reads over any wallpaper
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0,0,0,0.55)

    position = 0,56

    halign = center
    valign = center

    zindex = 2
}

####################################################
# PASSWORD
####################################################

input-field {

    monitor =

    size = 480,68

    outline_thickness = 2

    outer_color = $zenLine
    inner_color = rgba(255,255,255,0.06)

    font_color = $zenInk
    font_family = $zenFont

    placeholder_text = <span foreground="##ffffffaa">Input password</span>

    rounding = 34

    dots_size = 0.24
    dots_spacing = 0.32
    dots_center = true

    fade_on_empty = false

    position = 0,-42

    halign = center
    valign = center

    zindex = 2
}

####################################################
# LOCK ICON
####################################################

label {

    monitor =

    # v8.0.0-alpha-hf142 — the &##xa0; are LOAD-BEARING.
    #
    # hyprgraphics sizes a label's cairo surface with `logical.width`, i.e. the
    # ADVANCE (TextResource.cpp:88). It computes the ink extents on the line
    # above and then ignores them. In JetBrainsMono Nerd Font at 18px the cell
    # is 10.8px wide, but the lock's ink runs to 15px and the eye-slash's to
    # 21px. That ink is simply not in the surface — which is why they were cut
    # off on the right.
    #
    # A non-breaking space either side (never collapsed, unlike a plain space)
    # takes the advance to 32.4px against 32px of ink: nothing clipped, and the
    # ink centre lands 0.2px from the box centre, so `position` stays put.
    text = <span font_family="$zenIcon">&##xa0;&##xf023;&##xa0;</span>

    color = $zenInk

    font_size = 18

    position = -198,-42

    halign = center
    valign = center

    zindex = 3
}

# (eye icon removed in hf152 — hyprlock has no password-reveal; it was decoration only)


####################################################
# SHUTDOWN BUTTON
####################################################

shape {

    monitor =

    size = 250,66

    rounding = 33

    border_size = 2
    border_color = $zenLine

    color = $zenFill

    position = -142,-182

    halign = center
    valign = center

    zindex = 1

    onclick = systemctl poweroff
}

label {

    monitor =

    text = <span font_family="$zenIcon" size="20pt" rise="1400">&##xf011;</span>     <span font_family="$zenFont" size="15pt">Shutdown</span>

    color = $zenInk

    font_size = 17

    font_family = $zenFont

    position = -142,-182

    halign = center
    valign = center

    text_align = center

    # No `onclick` here on purpose. The pill `shape` beneath already carries it,
    # and hyprlock dispatches a click to EVERY widget under the cursor
    # (hyprlock.cpp:714-717) — with it on both, `systemctl poweroff` was spawned
    # twice per click.
    zindex = 2
}

####################################################
# RESTART BUTTON
####################################################

shape {

    monitor =

    size = 250,66

    rounding = 33

    border_size = 2
    border_color = $zenLine

    color = $zenFill

    position = 142,-182

    halign = center
    valign = center

    zindex = 1

    onclick = systemctl reboot
}

label {

    monitor =

    text = <span font_family="$zenIcon" size="20pt" rise="1400">&##xf021;</span>     <span font_family="$zenFont" size="15pt">Restart</span>

    color = $zenInk

    font_size = 17

    font_family = $zenFont

    position = 142,-182

    halign = center
    valign = center

    text_align = center

    # See the Shutdown label: the pill `shape` owns the onclick.
    zindex = 2
}
