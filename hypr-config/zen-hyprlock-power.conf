# ─────────────────────────────────────────────────────────────────────────────
# zen-hyprlock-power.conf — Zen Shell lock-screen power buttons
# Installed to ~/.config/hypr/zen-hyprlock-power.conf by install.sh, and pulled
# in by ONE line appended to your own hyprlock.conf:
#
#     source = ~/.config/hypr/zen-hyprlock-power.conf
#
# Your hyprlock.conf is never rewritten. The installer only appends that line,
# between markers, and only if you have no power buttons of your own.
#
# Verified against hyprlock's schema (src/config/ConfigManager.cpp @ main):
#   label : monitor position color font_size text font_family halign valign
#           rotate text_align zindex onclick
#   shape : monitor size rounding border_size border_color color position
#           halign valign rotate xray zindex onclick
#
# Requires hyprlock >= 0.9.0 — `onclick` does not exist in 0.8.x.
#
# A label has NO size and NO padding: it is exactly as big as its text. That is
# why the icons looked cramped. The pill is a `shape`, and inner padding is
# whatever the shape has that the label doesn't. Here the shape and the label
# share the SAME position/halign/valign, so the text is centred and the padding
# is (shape_width - text_width) / 2 on each side — symmetric by construction.
#
# Pango markup works in every widget's `text` (hyprlock assets/example.conf:4).
#
# WHY `&##xf011;` AND NOT `&#xf011;`
# In hyprlang a bare `#` truncates the rest of the line (config.cpp:688-716);
# `##` is the escape and becomes a literal `#`. The XML entity for the Nerd Font
# power glyph therefore has to be written with a doubled hash, or the markup is
# silently cut off at the ampersand and the label renders as garbage. Simulated
# against hyprlang's own parser: `&##xf011;` reaches Pango as `&#xf011;`.
# ─────────────────────────────────────────────────────────────────────────────

# Own variables, on purpose. `$font` in your hyprlock.conf is rewritten by
# zen-lock.sh from fontFamilyId; these are not touched by anything.
$zenIconFont  = JetBrainsMono Nerd Font
$zenLabelFont = Adwaita Sans

# ── SHUTDOWN ────────────────────────────────────────────────────────────────
shape {
    monitor =
    size = 220, 58
    rounding = 29
    border_size = 2
    border_color = rgba(255, 255, 255, 0.55)
    color = rgba(255, 255, 255, 0.06)
    position = -115, -300
    halign = center
    valign = center
    zindex = 0
    onclick = systemctl poweroff
}

label {
    monitor =
    # `rise` lifts the glyph onto the text's optical centre. Pango units:
    # 1024 = 1px. The Nerd Font power glyph hangs ~3px below the baseline at
    # font_size 28, so it needs about +0.05em. The two spaces after </span>
    # are the icon→text gap: a label cannot have padding, so it lives here.
    text = <span font_family="$zenIconFont" size="20pt" rise="1400">&##xf011;</span>  <span font_family="$zenLabelFont" size="14pt">Shutdown</span>
    color = rgba(255, 255, 255, 0.95)
    font_size = 16
    font_family = $zenLabelFont
    position = -115, -300
    halign = center
    valign = center
    text_align = center
    zindex = 1
    onclick = systemctl poweroff
}

# ── RESTART ─────────────────────────────────────────────────────────────────
shape {
    monitor =
    size = 220, 58
    rounding = 29
    border_size = 2
    border_color = rgba(255, 255, 255, 0.55)
    color = rgba(255, 255, 255, 0.06)
    position = 115, -300
    halign = center
    valign = center
    zindex = 0
    onclick = systemctl reboot
}

label {
    monitor =
    text = <span font_family="$zenIconFont" size="20pt" rise="1400">&##xf021;</span>  <span font_family="$zenLabelFont" size="14pt">Restart</span>
    color = rgba(255, 255, 255, 0.95)
    font_size = 16
    font_family = $zenLabelFont
    position = 115, -300
    halign = center
    valign = center
    text_align = center
    zindex = 1
    onclick = systemctl reboot
}
