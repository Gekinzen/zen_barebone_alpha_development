# ─────────────────────────────────────────────────────────────
# ZEN SHELL — KEYBINDS UPDATE (Phase 3b) — DEDUPED + v5 Settings
# Loaded AFTER ~/.config/hypr/modules/binds.conf
# ─────────────────────────────────────────────────────────────

# $mainMod already declared in binds.conf

# ── Apps ──
# v6.16.4.7: Super+T uses zen-terminal.sh which auto-detects the
# preferred terminal (alacritty first, kitty fallback, then any
# x-terminal-emulator). Previously hardcoded to `kitty` which
# silently failed on systems without kitty installed.
bind = $mainMod, T, exec, ~/.local/bin/zen-terminal.sh
bind = $mainMod, E, exec, thunar
bind = $mainMod, D, exec, fuzzel
bind = $mainMod, R, exec, fuzzel
bind = $mainMod, RETURN, exec, ~/.local/bin/termrun.sh
bind = $mainMod, B, exec, ~/.local/bin/btm-toggle.sh
bind = $mainMod, N, exec, ~/.local/bin/wifi-toggle.sh

# ── Zen Shell controls ──
bind = $mainMod, A, exec, qs -c zen-shell ipc call zen toggleStartMenu
bind = $mainMod, slash, exec, qs -c zen-shell ipc call zen toggleKeybindCheatsheet
bind = $mainMod, F2, exec, qs -c zen-shell ipc call zen toggleKeybindCheatsheet

# ── Settings App (Event Horizon style) ──
bind = $mainMod, comma, exec, qs -c zen-shell ipc call zen toggleSettings
bind = $mainMod SHIFT, comma, exec, qs -c zen-shell ipc call zen toggleSettings

# ── Control Panel (Quick Settings — v6.13) ──
bind = $mainMod, C, exec, qs -c zen-shell ipc call zen toggleControlCenter

# ── Wallpaper ──
bind = $mainMod, W, exec, qs -c zen-shell ipc call zen toggleWallpaperPicker
bind = $mainMod SHIFT, W, exec, qs -c zen-shell ipc call zen randomWallpaper

# ── Theme cycling ──
bind = $mainMod SHIFT, T, exec, qs -c zen-shell ipc call zen cycleTheme
bind = $mainMod SHIFT, Y, exec, qs -c zen-shell ipc call zen reloadTheme tokyo-night
bind = $mainMod SHIFT, U, exec, qs -c zen-shell ipc call zen reloadTheme catppuccin-mocha
bind = $mainMod SHIFT, I, exec, qs -c zen-shell ipc call zen reloadTheme dracula

# ── Style toggle (round vs pill) — moved from SHIFT+S to avoid
#   conflict with Screenshot Rope (below). Use SUPER ALT + S instead.
bind = $mainMod ALT, S, exec, qs -c zen-shell ipc call zen toggleStyle

# ── Power ──
bind = $mainMod SHIFT, L, exec, qs -c zen-shell ipc call zen powerLock
bind = $mainMod SHIFT, X, exec, qs -c zen-shell ipc call zen powerLogout
bind = $mainMod SHIFT, R, exec, qs -c zen-shell ipc call zen powerReboot
bind = $mainMod SHIFT, Q, exec, qs -c zen-shell ipc call zen powerShutdown

# ── Window mgmt ──
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod, G, togglefloating

# ── Workspaces ──
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# ── Mouse ──
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ── Volume (v6.16.0: swaync notifications via zen-volume-notify.sh) ──
binde = , XF86AudioRaiseVolume, exec, ~/.local/bin/zen-volume-notify.sh vol-up
binde = , XF86AudioLowerVolume, exec, ~/.local/bin/zen-volume-notify.sh vol-down
bind  = , XF86AudioMute,        exec, ~/.local/bin/zen-volume-notify.sh vol-mute
bind  = , XF86AudioMicMute,     exec, ~/.local/bin/zen-volume-notify.sh mic-mute

# ── Brightness (v6.16.0: swaync notifications via zen-volume-notify.sh) ──
binde = , XF86MonBrightnessUp,   exec, ~/.local/bin/zen-volume-notify.sh bright-up
binde = , XF86MonBrightnessDown, exec, ~/.local/bin/zen-volume-notify.sh bright-down

# ── Media ──
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# ── Hyprland Control Center (legacy GTK, optional) ──
bind = $mainMod, F1, exec, cd ~/.config/hypr-control-center && python3 main.py

# ── Screenshots (zen-screenshot.sh — active monitor aware) ──
bind = $mainMod, F12, exec, ~/.local/bin/zen-screenshot.sh region
bind = $mainMod SHIFT, F12, exec, ~/.local/bin/zen-screenshot.sh full
bind = , Print, exec, ~/.local/bin/zen-screenshot.sh region
bind = SHIFT, Print, exec, ~/.local/bin/zen-screenshot.sh clipboard
bind = $mainMod CTRL, F12, exec, ~/.local/bin/zen-screenshot.sh allscreens
bind = $mainMod ALT, F12, exec, pkill flameshot || flameshot gui

# ── v6.15: Screenshot rope overlay (physics rope on region screenshot) ──
# Appears on the monitor where the cursor currently is
bind = $mainMod SHIFT, S, exec, qs -c zen-shell ipc call zen zenScreenshotRope
